let S=null,sel=[],meta={xp:0,up:[],found:[],runs:0};try{meta={...meta,...JSON.parse(localStorage.getItem('foodchat-v2-pilot')||'{}')}}catch{}const app=document.getElementById('app'),names={s:'主食',p:'蛋鱼肉豆',v:'蔬菜',f:'水果'};function save(){try{localStorage.setItem('foodchat-v2-pilot',JSON.stringify(meta))}catch{}}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function tags(m){return m.food_tags.map(t=>'<span class="tag">'+names[t]+'</span>').join('')}function home(){S=null;app.innerHTML=`<p class="sub">WEEK 01 / 观察 · 推理 · 沟通</p><h1 class="hero">这一周，吃了什么？</h1><p>家人晒饭，你观察群聊，决定说什么。</p><div class="panel"><h2>日常周</h2><p>七天 · 14次晒饭 · 最后两餐自主观察</p><p class="sub">餐食类别覆盖满分42 · 仅为游戏指标</p><div class="actions"><button class="primary" onclick="start()">开始观察 →</button><button onclick="archive()">误解档案 ${meta.found.length}/12</button><button onclick="growth()">局外成长 ✦ ${meta.xp}</button><button onclick="profiles()">家庭成员</button></div></div><footer>V2 实验版 · 本机存档</footer>`}function start(){S=FC.init(D,Date.now()>>>0,meta.up);FC.record(D,S);sel=[];render()}
function profiles(){app.innerHTML='<h1>家庭成员</h1>'+Object.entries(D.characters).map(([id,p])=>`<div class="panel"><h2>${p.name} ${['grandma','grandpa'].includes(id)&&!meta.up.includes(id)?'· 未解锁':''}</h2><p>${Object.entries(p.motives).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>({taste:'口味',convenience:'省事',price:'节约',health:'健康',comfort:'舒适',familiarity:'熟悉',care:'关心家人',autonomy:'自主'}[x[0]])).join(' · ')}</p></div>`).join('')+'<button onclick="home()">返回</button>'}
const SHORT=[["保留面食","顺手加小菜","脆菜解腻","蔬果的价值","水果不代蔬菜"],["保留清淡","汤里加豆腐","少盐少油","清淡不等于粥汤"],["先垫肚子","请同学带餐","平价加蛋配菜","食物多样","配料不等于主菜"],["保留鸡蛋","加点脆生菜","蛋白质来源","蛋肉豆需搭配"],["保留水果","水果配饭团和蛋","蔬果的价值","水果不代蔬菜"],["一锅省事","蛋菜一起煮","食物多样","配料不等于主菜"],["保留肉和饭","顺手取小菜","蔬果的价值","水果不代蔬菜"],["庆祝交作业","先吃正餐","长期膳食平衡","健康不能抵扣"],["尊重口味","粥配软菜和蛋","少盐少油","清淡不等于粥汤"],["少油尝试","炸鸡配饭菜","少油烹调","少油不等于健康"],["保留清爽口味","自选面包和蛋","主食的作用","份量与整体搭配"],["保留鱼和饭","家人帮忙洗菜","食物多样","配料不等于主菜"],[],[]];
function render(){
 let e=D.events[S.i],r=S.history.at(-1),p=D.characters[e.person],active=e.intervention&&!S.done;
 let opts=['praise','advice','knowledge'].map((t,j)=>`<div><h3>${['肯定','建议','知识'][j]}</h3>${e.options.map((o,i)=>o.type===t?`<button ${!S.words||(!sel.includes(i)&&sel.length>=2)?'disabled':''} class="${sel.includes(i)?'chosen':''}" aria-pressed="${sel.includes(i)}" onclick="toggle(${i})"><span class="dot">${sel.includes(i)?'✓':'○'}</span><span>${esc(SHORT[S.i][i])}</span></button>`:'').join('')}</div>`).join('');
 let max=8+(S.up.includes('words')?1:0);
 let ticks=Array.from({length:max},(_,i)=>'<i class="'+(i<S.words?'on':'')+'"></i>').join('');
 let preview=sel.length?'<div class="preview"><small>拟发送</small>'+esc(sel.map(i=>e.options[i].text).join(' '))+'</div>':'';
 app.innerHTML=`<div class="gamehead"><div class="grouphead"><div><small>DAY ${e.day} / 7 · ${e.meal==='lunch'?'午餐':'晚餐'} · ${S.i+1}/14</small><h2>相亲相爱一家人（${Object.keys(S.people).length+1}）</h2></div><button class="back" onclick="home()">返回首页</button></div><div class="budget ${S.words<=2?'low':''}"><div><small>剩余发言 ${S.words<=2&&S.words>0?'· 即将用完':''}</small><b>${S.words}<small> / ${max}</small></b><div class="ticks">${ticks}</div></div><div><small>剩余点赞</small><b>${S.likes}</b></div><div><small>共鸣与接力</small><b>${S.impact}</b></div></div></div><div class="layout"><section class="chat" id="chat"><div class="msg"><div class="avatar">${p.name.slice(-1)}</div><div><div class="who">${p.name}</div><div class="meal">${esc(r.meal.label)}</div>${tags(r.meal)}<div class="bubble">${esc(r.changed?'今天顺手试了个新搭配。':r.v.clue)}</div>${r.spoken?'<div class="bubble">'+esc(D.misbeliefs[r.spoken].claim)+'。</div>':''}</div></div>${r.changed?'<div class="notice">实际尝试 · 新搭配</div>':''}${r.action&&r.action!=='观察'?'<div class="msg me"><div class="avatar">助</div><div><div class="who">管家</div><div class="bubble">'+esc(r.action)+'</div></div></div>':''}${r.feedback.map(f=>`<div class="notice ${f.type==='risk'?'risk':''}">${f.type==='relay'?'家人接力 · ':''}${esc(f.text)}</div>`).join('')}</section><section class="controls">${active?'<p class="gamehint">选择1–2个要点，合并发送</p><div class="cols">'+opts+'</div>'+preview:!e.intervention?'<p class="gamehint">管家离线 · 观察自主选择</p>':''}<div class="actions">${active?`<button onclick="skip()">沉默</button><button ${!S.likes?'disabled':''} onclick="like()">♡ 点赞</button><button class="primary" ${!sel.length||!S.words?'disabled':''} onclick="say()">发送</button>`:`<button class="primary" onclick="next()">${S.i===13?'查看一周报告':'下一次晒饭 →'}</button>`}</div></section></div>`;
 if(S.done){let chat=document.getElementById('chat');if(chat)chat.scrollTop=chat.scrollHeight}
}
function toggle(i){sel=sel.includes(i)?sel.filter(x=>x!==i):[...sel,i].slice(0,2);render()}function say(){if(FC.apply(D,S,sel))render()}function like(){FC.like(D,S);render()}function skip(){FC.skip(S);render()}function next(){if(S.i===13){finish();return}FC.next(D,S);sel=[];render()}
function finish(){let newF=S.found.filter(x=>!meta.found.includes(x));meta.found.push(...newF);meta.runs++;let gain=3+newF.length;meta.xp+=gain;save();app.innerHTML=`<p class="sub">WEEK REPORT</p><h1 class="hero">一周观察结束</h1><div class="budget"><div><small>类别覆盖（重点餐食）</small><b>${FC.score(S)}/42</b></div><div><small>实际尝试</small><b>${S.history.filter(r=>r.changed).length}</b></div><div><small>家人接力</small><b>${S.relay}</b></div></div><div class="panel"><h2>行为记录</h2><table><tr><th>时间</th><th>餐食</th><th>结果</th></tr>${S.history.map(r=>'<tr><td>第'+D.events[r.i].day+'天</td><td>'+esc(r.meal.label)+'</td><td>'+(r.changed?'尝试新搭配':'原有选择')+'</td></tr>').join('')}</table></div><div class="panel"><h2>误解回响</h2>${S.found.map(k=>'<p><b>'+D.misbeliefs[k].name+'</b> · '+esc(D.misbeliefs[k].corrective_text)+'</p>').join('')||'<p>本局未观察到明确误解。</p>'}<p>经验 +${gain}</p></div><div class="actions"><button class="primary" onclick="start()">再玩一局</button><button onclick="home()">返回首页</button></div>`}function archive(){app.innerHTML='<h1>误解观察档案</h1>'+Object.entries(D.misbeliefs).map(([id,m])=>`<div class="panel"><small>${m.kind}</small><h2>${meta.found.includes(id)?m.name:'？ 尚未发现'}</h2>${meta.found.includes(id)?'<p>'+esc(m.claim)+'</p><p>'+esc(m.corrective_text)+'</p>':''}</div>`).join('')+'<button onclick="home()">返回</button>'}const ups=[['words','额外发言 +1',4],['reply','家人更愿意回应',5],['grandma','奶奶加入群聊',6],['grandpa','爷爷加入群聊',6]];function growth(){app.innerHTML='<h1>局外成长</h1><p>经验 ✦ '+meta.xp+'</p>'+ups.map(([k,n,c])=>`<div class="panel"><b>${n}</b> <button ${meta.up.includes(k)||meta.xp<c?'disabled':''} onclick="buy('${k}')">${meta.up.includes(k)?'已解锁':'✦ '+c}</button></div>`).join('')+'<div class="actions"><button onclick="home()">返回</button><button onclick="reset()">重置V2存档</button></div>'}function buy(k){let u=ups.find(x=>x[0]===k);if(!u||meta.up.includes(k)||meta.xp<u[2])return;meta.xp-=u[2];meta.up.push(k);save();growth()}function reset(){if(confirm('清空本测试版进度？')){meta={xp:0,up:[],found:[],runs:0};save();home()}}home();</script></html>
