function wpic(id){let items=M[id][2],shapes='';const col={rice:'#f0e5cc',noodle:'#e5bd79',beef:'#895d44',pork:'#a76c45',egg:'#f4ddb1',greens:'#698446',cucumber:'#91ab64',tomato:'#c96a4e',tofu:'#e9d7b6',soup:'#d0b47e',broth:'#b58a57',bun:'#eadcc0',sandwich:'#d8b77d',apple:'#ce775c',orange:'#eaa45c',tea:'#bc9d76',porridge:'#eee4cf',pickle:'#9b955d',pancake:'#d5a45e',scallion:'#6b8b48',spice:'#a66143',bread:'#d9b17b',cake:'#c2a388',fish:'#a9aaa0',chicken:'#c28a4e',fries:'#e7be70'};let k=0;for(let [j,item] of items.entries()){let a=j*Math.PI*2/items.length-.7,x=160+Math.cos(a)*(items.length===1?0:49),y=99+Math.sin(a)*(items.length===1?0:38);let color=col[item]||'#c6b48c';if(item==='noodle'){for(let n=0;n<18;n++){let yy=y-19+n*2.2;shapes+='<path d="M'+(x-38)+' '+yy+' q18 -16 36 0 t36 0" fill="none" stroke="'+(n%3?'#d8ac65':'#f0d18f')+'" stroke-width="3" stroke-linecap="round"/>'}}else if(['greens','scallion','cucumber','spice','pickle'].includes(item)){for(let n=0;n<(item==='scallion'||item==='spice'?6:17);n++){let xx=x+Math.sin(n*7)*24,yy=y+Math.cos(n*5)*18;shapes+='<ellipse cx="'+xx+'" cy="'+yy+'" rx="'+(item==='scallion'?4:9)+'" ry="'+(item==='scallion'?2:5)+'" fill="'+color+'" opacity="'+(.72+n%3*.1)+'" transform="rotate('+(n*41)+' '+xx+' '+yy+')"/>'}}else if(item==='egg'){shapes+='<ellipse cx="'+x+'" cy="'+y+'" rx="16" ry="22" fill="#f4e5c9" stroke="#bda886"/><circle cx="'+x+'" cy="'+y+'" r="10" fill="#dba64c"/>'}else if(['bun','apple','orange'].includes(item)){shapes+='<circle cx="'+x+'" cy="'+y+'" r="24" fill="'+color+'" stroke="#a99071"/><path d="M'+(x-8)+' '+(y-14)+'q8 -6 16 0" fill="none" stroke="#f8edd8" stroke-width="2"/>'}else if(['broth','soup','porridge','tea'].includes(item)){shapes+='<ellipse cx="'+x+'" cy="'+y+'" rx="35" ry="24" fill="'+color+'" stroke="#a78c68" stroke-width="3"/>'}else{let count=item==='rice'?18:6;for(let n=0;n<count;n++){let xx=x+Math.sin(n*5)*23,yy=y+Math.cos(n*3)*17;shapes+='<rect x="'+(xx-8)+'" y="'+(yy-5)+'" width="'+(item==='rice'?14:21)+'" height="'+(item==='rice'?7:14)+'" rx="4" fill="'+color+'" stroke="#9d8769" stroke-opacity=".25" transform="rotate('+(n*23)+' '+xx+' '+yy+')"/>'}}}

const N=['老妈','老爸','女儿','管家'],A=['妈','爸','女','助'];
M.ju=['橙汁（示意）','',['orange']];M.fr=['鲜橙','',['orange']];
const cases=[
{p:1,meal:'so',time:'周一 12:42',diag:'排骨汤配饭，肉量少，汤底用盐未知。',lines:[[1,'今天食堂排骨汤不错，炖得挺浓的。'],[0,'排骨也吃了吧？'],[1,'肉柴得很，剩了几块。汤我倒喝完了。','a'],[1,'炖了那么久，营养多少都进汤里了吧。','b'],[2,'爸你不是一直嫌排骨塞牙嘛。','c'],[1,'嗯，食堂那种大块的我不爱嚼。','d'],[0,'今天下班我顺路买菜。']],tags:[['重汤轻料','belief','a','b'],['嫌肉柴','motive','c','d'],['软嫩优先','motive','d','e']],fact:'炖煮时有些营养会进入汤，但相当一部分蛋白质仍留在肉里。汤的鲜味不能说明蛋白质含量。',practical:'嫌排骨柴的话，嫩豆腐、蒸蛋也能提供蛋白质，不必硬吃不喜欢的肉。',pair:'汤可以照喝。你嫌排骨柴，不妨选嫩豆腐或蒸蛋补充蛋白质；喝汤不能代替吃固体食材。',resist:'肉有营养我知道，可食堂那肉太柴了。讲这个我也不一定吃得下。',follow:'嫩豆腐倒是挺好入口的，食堂也常有。',accept:'豆腐我倒是吃得惯，碰上有豆腐的窗口我试试。',later:'后来食堂有嫩豆腐，爸爸选了米饭、豆腐和青菜。',better:'to',stay:'爸爸仍然买了排骨汤配饭，还没找到合口味的替代搭配。'},
{p:0,meal:'p',time:'周二 18:20',diag:'白粥、咸菜，食材较单一；咸菜可能含较多钠。',lines:[[0,'这两天吃点清淡的，晚上就煮了白粥。','a'],[2,'妈，冰箱还有鱼，清蒸也挺好。'],[0,'鱼明天再吃吧。晚上不想吃那么多东西，粥喝着舒服。','c'],[1,'你粥里配的咸菜不是还挺咸的？'],[0,'就一小碟。今天没炒菜，也没用什么油，心里踏实。','b'],[0,'这会儿胃口一般，不想再做一锅。','d']],tags:[['清淡重少油','belief','a','b'],['胃口一般','motive','c','d'],['不想另开锅','motive','d','e']],fact:'清淡饮食不只是少油，还要关注盐和食物搭配。白粥配咸菜不一定比清蒸鱼和青菜更符合清淡饮食。',practical:'胃口一般时，粥可以留着。等胃口好些，按情况配些软嫩的蛋、豆腐或青菜。',pair:'粥照喝，不用勉强换成鱼。等胃口好些，可以把蛋和青菜放进粥里，少放咸菜，也能做得清淡。',resist:'我也不是说鱼不健康，就是这会儿不想吃鱼。',follow:'要是跟粥放在一个锅里煮，倒是省事。',accept:'等胃口好点我煮个鸡蛋青菜粥吧，今天先喝原来的。',later:'妈妈打算等胃口恢复再调整，今天没有立刻改餐。',better:'p',stay:'妈妈今天仍然喝白粥。仅凭这一顿不能判断她的长期饮食。'},
{p:2,meal:'ju',time:'周三 10:15',diag:'橙汁饮品，实际份量和配方未知，不能等同完整鲜果。',lines:[[2,'早八路上买了瓶橙汁，今天的水果任务完成。','a'],[1,'不是昨天还买了橙子吗？'],[2,'那个得剥皮，包里又没地方放。','c'],[2,'这瓶写着100%果汁。我觉得跟吃橙子差不多吧。','b'],[0,'橙子我给你留着。'],[2,'早上就几分钟，不想拿一手黏糊糊的东西。','d']],tags:[['果汁算鲜果','belief','a','b'],['携带方便','motive','c','d'],['不想弄脏手','motive','d','e']],fact:'即使是100%果汁，也不能代替完整鲜果。榨汁通常损失部分纤维，而且喝下果汁往往比吃完整水果更快。',practical:'赶课可以带洗好的苹果，或者把水果留到下午吃，不用非在早上完成。',pair:'100%果汁也不是完整鲜果的等价替代。赶课又怕弄脏手的话，带洗好的苹果或者下午再吃水果，可能更省事。',resist:'我又不是不知道水果好。早八没时间剥橙子，喝果汁比较快。',follow:'下午在图书馆倒有时间吃，苹果也不太会弄脏手。',accept:'那我下午带苹果吧。早上偶尔还是会买果汁。',later:'隔天女儿把鲜果留到下午吃，没有承诺从此不喝果汁。',better:'fr',stay:'女儿赶课时仍然买了果汁，便利性还没有解决。'}

let st;
function make(i=0,history=[],found=[]){return {i,history,found,attention:3,pending:[],archive:[],tags:[],selected:[],used:[],lines:cases[i].lines.map(x=>x.slice()),fit:false,notice:'',done:false}}
function C(x){return cases[x.i]}
function get(x,id){return x.lines.find(l=>l[2]===id)}
function collectState(x,id){if(x.done||!get(x,id)||x.pending.includes(id)||x.archive.includes(id))return false;if(x.pending.length>=4){x.notice='线索板已满，请移除无关线索。';return false}x.pending.push(id);x.notice='';for(let t of C(x).tags){let [label,type,...ids]=t;if(!x.tags.some(k=>k.label===label)&&ids.every(id=>x.pending.includes(id)||x.archive.includes(id))){x.tags.push({label,type,ids,status:'有证据支持'});for(let id of ids){if(!x.archive.includes(id))x.archive.push(id);x.pending=x.pending.filter(v=>v!==id)}if(!x.found.includes(label))x.found.push(label);x.lines.push([9,'发现词条：'+label])}}return true}
function draft(x){let a=x.tags.filter(t=>x.selected.includes(t.label));if(!a.length)return null;let belief=a.some(t=>t.type==='belief'),motive=a.some(t=>t.type==='motive'),kind=belief&&motive?'pair':belief?'fact':'practical';return {kind,text:C(x)[kind],cost:kind==='pair'?2:1}}
function sendState(x){let d=draft(x),c=C(x);if(!d||x.attention<d.cost||x.used.includes(d.kind))return false;x.attention-=d.cost;x.used.push(d.kind);x.lines.push([3,d.text]);if(d.kind==='pair'){x.fit=true;x.lines.push([c.p,c.accept]);let t=x.tags.find(t=>t.type==='belief');t.status='开始重新考虑';x.lines.push([9,'词条变化：'+t.label+' → 开始重新考虑'])}else{x.lines.push([c.p,d.kind==='fact'?c.resist:c.accept]);if(!get(x,'e'))x.lines.push([c.p,c.follow,'e'])}x.lines.push([9,'注意力 −'+d.cost+' · 剩余 '+x.attention+'/3']);x.selected=[];return true}
function advance(x){let h=[...x.history,{i:x.i,fit:x.fit,tags:x.tags.map(t=>({...t})),evidence:x.archive.map(id=>get(x,id)[1])}];return x.i===2?{...x,history:h,done:true}:make(x.i+1,h,x.found)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function collect(id){collectState(st,id);render(true)}
function remove(id){st.pending=st.pending.filter(k=>k!==id);st.notice='';render(true)}
function choose(j){let t=st.tags[j].label;st.selected=st.selected.includes(t)?st.selected.filter(x=>x!==t):st.selected.length===2?[st.selected[1],t]:[...st.selected,t];render(true)}
function send(){if(sendState(st))render(false)}
function next(){st=advance(st);render(false)}
function restart(){st=make();render(false)}
function dropClue(e){e.preventDefault();let id=e.dataTransfer.getData('text/plain');if(get(st,id))collect(id)}
function message(l){let [p,t,id]=l;if(p===9)return '<div class="system">'+esc(t)+'</div>';let saved=st.pending.includes(id)||st.archive.includes(id);return '<div class="msg '+(p===3?'me':'')+'"><span class="avatar">'+A[p]+'</span><div class="content"><small>'+N[p]+'</small><div class="bubble '+(id?'clue':'')+'" '+(id?'draggable="true" ondragstart="event.dataTransfer.setData(\'text/plain\',\''+id+'\')" role="button" tabindex="0" onclick="collect(\''+id+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();collect(\''+id+'\')}"':'')+'>'+esc(t)+(id?'<span class="plus">'+(saved?'✓':'＋')+'</span>':'')+'</div></div></div>'}

function report(){return '<div class="report"><h1>三次观察之后</h1><p>发现 '+st.found.length+' 个有证据支持的词条。理解和行动并不是一回事。</p>'+st.history.map(h=>{let c=cases[h.i];return '<div class="receipt"><b>'+N[c.p]+'</b>'+photo(h.fit?c.better:c.meal)+'<p>'+esc(h.fit?c.later:c.stay)+'</p><details><summary>推理证据</summary>'+h.tags.map(t=>'<p>'+esc(t.label)+' · '+esc(t.status)+'</p>').join('')+h.evidence.map(t=>'<blockquote>'+esc(t)+'</blockquote>').join('')+'</details></div>'}).join('')+'<p class="hint">虚构情境与预设分支，不代表真实行为干预效果。</p><button class="primary" onclick="restart()">重新观察</button></div>'}
function render(preserve){let old=document.getElementById('chat'),y=old?.scrollTop||0,c=C(st),d=st.done?null:draft(st);document.getElementById('app').innerHTML='<header><div><small>饮食健康群聊管家 · 线索推理</small><h1>相亲相爱一家人（4）</h1></div><b>'+Math.min(st.i+1,3)+'/3</b></header>'+(st.done?report():'<div class="layout"><aside ondragover="event.preventDefault()" ondrop="dropClue(event)"><h2>线索板 <small>'+st.pending.length+'/4</small></h2><p class="hint">点击或拖动话语，相关证据自动合成词条。</p><div class="pending">'+(st.pending.length?st.pending.map(id=>'<div class="evidence"><small>'+N[get(st,id)[0]]+'</small><button class="remove" onclick="remove(\''+id+'\')">×</button><p>'+esc(get(st,id)[1])+'</p></div>').join(''):'<div class="empty">收集人物说过的话</div>')+'</div><h2>我的推理</h2>'+(st.tags.length?st.tags.map((t,j)=>'<div class="tag"><button class="'+(st.selected.includes(t.label)?'selected':'')+'" onclick="choose('+j+')">'+esc(t.label)+(t.status==='开始重新考虑'?' · 动摇':'')+'</button><details><summary>依据 '+t.ids.length+' 条</summary>'+t.ids.map(id=>'<p>'+esc(get(st,id)[1])+'</p>').join('')+'</details></div>').join(''):'<p class="hint">暂无词条</p>')+(st.notice?'<p class="hint">'+esc(st.notice)+'</p>':'')+'</aside><section><div class="chat" id="chat"><div class="system">'+c.time+'</div><div class="msg"><span class="avatar">'+A[c.p]+'</span><div><small>'+N[c.p]+'</small>'+photo(c.meal)+'</div></div>'+st.lines.map(message).join('')+'</div><div class="controls"><details><summary>餐食观察</summary><p>'+esc(c.diag)+'</p></details><div class="attention">注意力 '+[0,1,2].map(i=>'<i class="'+(i<st.attention?'on':'')+'"></i>').join('')+'<b>'+st.attention+'/3</b></div>'+(d?'<div class="preview"><small>'+esc(st.selected.join(' ＋ '))+'</small><p>'+esc(d.text)+'</p></div>':'<p class="hint">选择一个或两个词条，生成消息。</p>')+'<div class="buttons"><button onclick="next()">继续观察 →</button><button class="primary" '+(!d||st.attention<d.cost||st.used.includes(d.kind)?'disabled':'onclick="send()"')+'>发送'+(d?' · '+d.cost+' 格':'')+'</button></div></div></section></div>')+'<footer><a href="latest.html">返回旧版首页</a> · <a href="https://dg.cnsoc.org/article/04/J4-AsD_DR3OLQMnHG0-jZA.html">膳食指南</a></footer>';let ch=document.getElementById('chat');if(ch)ch.scrollTop=preserve?y:old?ch.scrollHeight:0}

restart();</script></body></html>
