function connected(x,ids){if(ids.some(id=>!x.positions[id]||!x.evidence[id]))return false;let seen=new Set([ids[0]]);for(let n=0;n<ids.length;n++)for(let a of ids)if(seen.has(a))for(let b of ids)if(near(x.positions[a],x.positions[b]))seen.add(b);return seen.size===ids.length}
function evaluatePlacement(x,moved){let found=[],updates=[];
for(let h of hypotheses){let old=x.tags.find(t=>t.id===h.id);
if(old&&old.status!=='需修订'&&h.counter?.length){let pair=old.ids.flatMap(a=>h.counter.map(b=>[a,b])).find(ids=>ids.includes(moved)&&connected(x,ids));if(pair){old.status='需修订';old.ids=[...new Set([...old.ids,...pair])];updates.push(N[h.p]+' · '+h.label+'，新证据提示需要修订');continue}}
if(old)continue;
let ids=h.need.find(ids=>ids.includes(moved)&&connected(x,ids));if(!ids)continue;
x.tags.push({id:h.id,ids:ids.slice(),status:'已支持',checkAfter:x.i,anchor:ids.slice()});found.push(N[h.p]+' · '+h.label);
}
for(let t of found)x.lines.push([9,'发现词条：'+t]);for(let t of updates)x.lines.push([9,'词条变化：'+t]);return {found,updates}}
function moveEvidenceState(x,id,left,top,width=560){if(!x.positions[id])return null;let pos=x.positions[id];pos.x=Math.round(Math.max(0,Math.min(Math.max(0,width-CW),left)));pos.y=Math.round(Math.max(0,top));return evaluatePlacement(x,id)}
const oldDraftSpatial=draft;draft=function(x){let d=oldDraftSpatial(x);if(d?.ts?.some(t=>t.status==='需修订'))return {blocked:true,text:'这个词条受到新证据质疑，先不要用来给家人下结论。',cost:0};return d};
function stageWidth(){return document.getElementById('boardStage')?.clientWidth||560}
function collect(id){let w=stageWidth();if(collectState(st,id,w)){render(true);let pane=document.getElementById('boardScroll'),p=st.positions[id];if(pane&&p&&(p.y+CH>pane.scrollTop+pane.clientHeight||p.y<pane.scrollTop))pane.scrollTop=Math.max(0,p.y-20)}}
function removeEvidence(id){if(st.tags.some(t=>t.ids.includes(id))){st.notice='已形成词条的证据需要保留。';render(true);return}delete st.evidence[id];delete st.positions[id];render(true)}
function cardStart(e,id){if(e.button!==undefined&&e.button!==0)return;if(e.target.closest?.('button'))return;let node=e.currentTarget,p=st.positions[id];if(!p)return;e.preventDefault();node.setPointerCapture?.(e.pointerId);dragCard={id,node,pointer:e.pointerId,sx:e.clientX,sy:e.clientY,x:p.x,y:p.y,moved:false};node.classList.add('moving')}
let dragCard=null;
function cardMove(e){let d=dragCard;if(!d||d.pointer!==e.pointerId)return;let dx=e.clientX-d.sx,dy=e.clientY-d.sy;if(Math.abs(dx)+Math.abs(dy)>5)d.moved=true;if(!d.moved)return;let left=Math.max(0,Math.min(stageWidth()-CW,d.x+dx)),top=Math.max(0,d.y+dy);d.node.style.left=left+'px';d.node.style.top=top+'px';d.left=left;d.top=top}
function cardEnd(e){let d=dragCard;if(!d||d.pointer!==e.pointerId)return;dragCard=null;d.node.classList.remove('moving');if(d.moved){moveEvidenceState(st,d.id,d.left??d.x,d.top??d.y,stageWidth());render(true)}}
function cardCancel(){if(!dragCard)return;dragCard=null;render(true)}
function spatialMessage(l){let [p,t,id]=l;if(p===9)return '<div class="system">'+esc(t)+'</div>';let can=p<3&&!!observation(st,id||''),saved=!!st.evidence[id];return '<div class="msg '+(p===3?'me':'')+'"><span class="avatar">'+A[p]+'</span><div class="content"><small>'+N[p]+'</small><div class="bubble '+(can?'clue':'')+(saved?' saved':'')+'" '+(can?'draggable="true" ondragstart="event.dataTransfer.setData(\'text/plain\',\''+id+'\')" role="button" tabindex="0" onclick="collect(\''+id+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();collect(\''+id+'\')}"':'')+'>'+esc(t)+'</div></div></div>'}
message=spatialMessage;
function mealMessage(i){let c=scenes[i],id=i+':photo',saved=!!st.evidence[id];return '<div class="msg"><span class="avatar">'+A[c.p]+'</span><div><small>'+N[c.p]+'</small><div class="photo photoClue '+(saved?'saved':'')+'" draggable="true" ondragstart="event.dataTransfer.setData(\'text/plain\',\''+id+'\')" role="button" tabindex="0" onclick="collect(\''+id+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();collect(\''+id+'\')}">'+wpic(c.meal)+'<small>'+esc(M[c.meal][0])+' · 观察餐图</small></div></div></div>'}
const oldPicSpatial=wpic;wpic=function(id){if(id!=='ju')return oldPicSpatial(id);return '<svg viewBox="0 0 320 200" role="img" aria-label="橙汁瓶示意"><rect width="320" height="200" rx="12" fill="#ded6c1"/><ellipse cx="160" cy="177" rx="40" ry="7" fill="#ac9978" opacity=".3"/><rect x="137" y="13" width="46" height="22" rx="5" fill="#698054"/><path d="M140 35H180V53Q192 65 192 78V163Q192 175 180 175H140Q128 175 128 163V78Q128 65 140 53Z" fill="#edaf53" stroke="#b8823e" stroke-width="2"/><rect x="128" y="93" width="64" height="49" rx="3" fill="#f4ebce"/><text x="160" y="113" text-anchor="middle" font-size="12" fill="#95642b">橙汁</text><text x="160" y="130" text-anchor="middle" font-size="10" fill="#95642b">100%</text></svg>'};
function tagLabel(t){let h=byId(t.id);return '<button class="spTag '+h.val+(st.selected.includes(t.id)?' selected':'')+(t.status==='需修订'?' revised':'')+'" onclick="choose(\''+t.id+'\')" aria-pressed="'+st.selected.includes(t.id)+'" title="'+esc(t.ids.map(id=>st.evidence[id]?.text).join('；'))+'">'+esc(N[h.p])+' · '+esc(h.label)+(t.status==='需修订'?'（待修订）':'')+'</button>'}
function board(){let ev=Object.values(st.evidence),height=Math.max(520,...ev.map(e=>(st.positions[e.id]?.y||0)+CH+72)),tags=st.tags;
let lines='',float='';
for(let [j,t] of tags.entries()){let h=byId(t.id),ps=(t.anchor||t.ids).map(id=>st.positions[id]).filter(Boolean);if(!ps.length)continue;let cx=ps.reduce((n,p)=>n+p.x+CW/2,0)/ps.length,cy=Math.max(...ps.map(p=>p.y+CH))+20;for(let p of ps)lines+='<line x1="'+(p.x+CW/2)+'" y1="'+(p.y+CH/2)+'" x2="'+cx+'" y2="'+cy+'" stroke="'+(h.val==='negative'?'#bb967b':h.val==='positive'?'#77966b':'#a3aba0')+'" stroke-width="1.6" stroke-dasharray="4 3"/>';float+='<div class="floatingTag" style="left:'+cx+'px;top:'+cy+'px;--offset:'+((j%3)*5)+'px">'+tagLabel(t)+'</div>';height=Math.max(height,cy+60)}
return '<aside class="spBoard"><div class="boardhead"><h2>线索板 <small>'+ev.length+' 条证据 · '+tags.length+' 个词条</small></h2><p class="hint">从右侧收集餐图或有意义的话语。拖动卡片靠近，相关证据会浮现词条。</p></div><div class="tagbar">'+(tags.length?tags.map(tagLabel).join(''):'<span class="hint">发现的词条将出现在这里，可点击生成消息。</span>')+'</div><div id="boardScroll" class="boardScroll" ondragover="event.preventDefault()" ondrop="boardDrop(event)"><div id="boardStage" class="boardStage" style="height:'+height+'px"><svg class="connections" width="100%" height="100%" aria-hidden="true">'+lines+'</svg>'+(ev.length?'':'<div class="canvasEmpty"><b>空白线索板</b><p>点击餐图或拖入相关对话。</p><p>把有共同含义的证据摆在一起。</p></div>')+ev.map(e=>{let p=st.positions[e.id];return '<article class="spCard '+(e.photo?'mealEvidence':'')+'" style="left:'+p.x+'px;top:'+p.y+'px" onpointerdown="cardStart(event,\''+e.id+'\')" onpointermove="cardMove(event)" onpointerup="cardEnd(event)" onpointercancel="cardCancel()"><div class="cardMeta"><small>第'+(e.day+1)+'段 · '+N[e.p]+' · '+(e.photo?'餐图':'原话')+'</small><button aria-label="移出画板" class="remove" onclick="removeEvidence(\''+e.id+'\')">×</button></div>'+(e.photo?'<div class="thumb">'+wpic(e.photo)+'</div>':'')+'<p>'+esc(e.text)+'</p></article>'}).join('')+float+'</div></div>'+(st.notice?'<p class="hint">'+esc(st.notice)+'</p>':'')+'</aside>'}
function boardDrop(e){e.preventDefault();let id=e.dataTransfer.getData('text/plain'),stage=document.getElementById('boardStage');if(!stage||!observation(st,id))return;let rect=stage.getBoundingClientRect();if(!st.evidence[id])collectState(st,id,stage.clientWidth);moveEvidenceState(st,id,e.clientX-rect.left-CW/2,e.clientY-rect.top-CH/2,stage.clientWidth);render(true)}
let playbackOwner=null,playbackDay=-1,visibleLines=0,playbackTimer=null;
function skipRemainingChats(){if(st.done)return;clearPlayback();st.skipped=true;st.done=true;st.selected=[];render(true)}
function isPlaying(){return !st.done&&visibleLines<st.lines.length}
function clearPlayback(){if(playbackTimer!==null){clearTimeout(playbackTimer);playbackTimer=null}}
function syncPlayback(){if(playbackOwner!==st||playbackDay!==st.i){clearPlayback();playbackOwner=st;playbackDay=st.i;visibleLines=0}else if(playbackTimer===null&&st.lines.slice(visibleLines).every(l=>l[0]===9)){visibleLines=st.lines.length}}
function updatePlaybackControls(){let nextButton=document.getElementById('chatNext'),sendButton=document.getElementById('chatSend'),d=st.done?null:draft(st);if(nextButton)nextButton.textContent=isPlaying()?'显示剩余消息':'继续观察 →';if(sendButton)sendButton.disabled=isPlaying()||!d||d.blocked||st.attention<d.cost||d.ids.some(id=>st.used.includes(id))}
function schedulePlayback(){if(playbackTimer!==null||!isPlaying())return;let owner=st,day=st.i,l=st.lines[visibleLines],delay=l[0]===9?220:Math.min(1150,550+String(l[1]).length*13);playbackTimer=setTimeout(()=>{playbackTimer=null;if(st!==owner||st.i!==day||st.done)return;let ch=document.getElementById('chat');if(!ch)return;let follow=ch.scrollHeight-ch.clientHeight-ch.scrollTop<100;let line=st.lines[visibleLines++];ch.insertAdjacentHTML('beforeend',message(line));if(follow)ch.scrollTop=ch.scrollHeight;updatePlaybackControls();schedulePlayback()},delay)}
render=function(preserve){syncPlayback();let old=document.getElementById('chat'),oldB=document.getElementById('boardScroll'),y=old?.scrollTop||0,by=oldB?.scrollTop||0,bx=oldB?.scrollLeft||0,open=document.getElementById('pastChat')?.open,c=getScene(st),d=st.done?null:draft(st);
document.getElementById('app').innerHTML='<header><div><small>饮食健康群聊管家 · 线索画板</small><h1>家庭观察室</h1></div><b>'+Math.min(st.i+1,6)+'/6</b></header>'+(st.done?report():'<div class="layout spatial">'+board()+'<section class="chatSide"><div class="chathead" style="display:flex;align-items:center;justify-content:space-between;gap:8px"><b>相亲相爱一家人（4）</b><button onclick="skipRemainingChats()" style="font-size:12px;padding:5px 8px;white-space:nowrap" title="保留当前记录，直接进入观察档案">跳过后续群聊 »</button></div><div class="chat" id="chat"><details class="past" id="pastChat" '+(open?'open':'')+'><summary>之前的群聊（'+st.past.length+'段）</summary>'+st.past.map(a=>'<div class="system">'+scenes[a.i].time+'</div>'+mealMessage(a.i)+a.lines.map(message).join('')).join('')+'</details><div class="system">'+c.time+'</div>'+mealMessage(st.i)+st.lines.slice(0,visibleLines).map(message).join('')+'</div><div class="controls"><details><summary>餐食观察</summary><p>'+esc(c.diag)+'</p></details><div class="attention">注意力 '+[0,1,2].map(i=>'<i class="'+(i<st.attention?'on':'')+'"></i>').join('')+'<b>'+st.attention+'/3</b></div>'+(d?'<div class="preview"><small>'+esc(d.blocked?'':N[d.p]+' · '+d.kind)+'</small><p>'+esc(d.text)+'</p></div>':'<p class="hint">选择画板词条，也可以继续观察。</p>')+'<div class="buttons"><button id="chatNext" onclick="next()">'+(isPlaying()?'显示剩余消息':'继续观察 →')+'</button><button id="chatSend" class="primary" '+(isPlaying()||!d||d.blocked||st.attention<d.cost||d.ids.some(id=>st.used.includes(id))?'disabled':'')+' onclick="send()"'+'>发送'+(d&&!d.blocked?' · '+d.cost+' 格':'')+'</button></div></div></section></div>')+'<footer><a href="latest.html">返回完整旧版</a> · <a href="https://www.who.int/news-room/fact-sheets/detail/healthy-diet">健康膳食依据</a></footer>';let ch=document.getElementById('chat'),pane=document.getElementById('boardScroll');if(ch)ch.scrollTop=preserve?y:0;if(pane){pane.scrollTop=by;pane.scrollLeft=bx}schedulePlayback()}
send=function(){if(isPlaying())return;if(sendState(st)){visibleLines++;render(true);let ch=document.getElementById('chat');if(ch)ch.scrollTop=ch.scrollHeight}};
next=function(){if(isPlaying()){clearPlayback();visibleLines=st.lines.length;render(true);let ch=document.getElementById('chat');if(ch)ch.scrollTop=ch.scrollHeight;return}advance(st);render(false)};

restart();</script></body></html>
