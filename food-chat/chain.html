:root{--ink:#294437;--bg:#f7f7f3;--line:#e1e5dd;--green:#385943}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);line-height:1.55}#app{max-width:620px;margin:auto;min-height:100vh;background:#fff;padding:0 16px 18px}header{display:flex;justify-content:space-between;align-items:center;padding:20px 0 10px}h1{font-size:20px;margin:3px 0}small,.note{font-size:12px;color:#7b877c}.day{white-space:nowrap;font-size:13px;font-weight:650}.sticky{position:sticky;top:0;background:#fff;z-index:2;padding:5px 0 10px;border-bottom:1px solid var(--line)}.pinned{display:flex;gap:10px;align-items:center;background:#edf2e9;padding:10px 13px;border-radius:10px}.pinIcon{font-size:24px;font-weight:bold}.pinned small,.pinned b{display:block}.pinned b{font-size:15px}.progress{display:flex;justify-content:space-between;font-size:12px;color:#758073;padding-top:6px}.time,.system{text-align:center;color:#92988f;font-size:12px;margin:12px 0}.msg{display:flex;gap:9px;margin:12px 0;align-items:flex-start}.avatar{width:34px;height:34px;border-radius:8px;background:#e8ede5;display:grid;place-items:center;flex:none}.content{max-width:86%;min-width:0}.name{font-size:12px;color:#7e887e}.bubble{background:#edf0eb;padding:9px 12px;border-radius:10px;font-size:15px;white-space:pre-wrap}.me{flex-direction:row-reverse}.me .name{text-align:right}.me .bubble{background:var(--green);color:white}.photo{max-width:190px;background:#f3f1e9;border-radius:10px;overflow:hidden;margin:3px 0}.photo svg{display:block;width:100%;height:auto}.mealname{font-size:11px;padding:3px 7px;color:#6c7566}.quote{font-size:12px;color:#7e887a;background:#f6f7f4;border-left:2px solid #bac8b5;padding:5px 8px;margin-bottom:4px}.pinBtn{display:block;margin-top:5px;border:1px solid #b5c8ae;background:#fff;color:var(--green);border-radius:6px;padding:6px 11px;font-weight:650;cursor:pointer;font-size:13px}.pinBtn:hover,.pinBtn:focus{background:#e5efdf}.me .pinBtn{margin-left:auto}.decision{border-top:1px solid var(--line);padding:10px 0}.hint{font-size:13px;color:#687767;margin:8px 0}.keep,.primary{width:100%;font:inherit;border-radius:9px;padding:11px;cursor:pointer}.keep{background:white;border:1px solid var(--line);color:var(--green)}.primary{background:var(--green);border:0;color:white;font-weight:600}.result{border:1px solid var(--line);background:#f8faf6;padding:15px;border-radius:12px;margin:15px 0}.eyebrow{font-size:12px;color:#72816e}.result h2{margin:4px 0 10px}.summary{font-size:14px;margin:8px 0}.summary b{font-size:20px}.resultrow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}.warn{color:#986d44}details{font-size:13px;color:#738170;margin:6px 0}details p{margin:4px 0}footer{font-size:12px;text-align:center;color:#8d968b;padding:12px 0}a{color:#6b8268}section{scroll-margin-top:100px}button:focus-visible{outline:2px solid #557e50;outline-offset:2px}@media(max-width:420px){#app{padding:0 12px 12px}.content{max-width:85%}.bubble{font-size:14px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><div id="app"></div><script>const M={"n":["牛肉汤面（少量牛肉）","s",["noodle","beef"]],"ne":["牛肉面、卤蛋","sp",["noodle","beef","egg"]],"nv":["牛肉面、卤蛋、青菜","spv",["noodle","egg","greens"]],"r":["红烧肉盖饭","sp",["rice","pork"]],"rv":["红烧肉、米饭、青菜","spv",["rice","pork","greens"]],"to":["米饭、豆腐、青菜","spv",["rice","tofu","greens"]],"rs":["米饭、冬瓜汤","sv",["rice","soup"]],"b":["两个菜包（少量馅）","s",["bun","bun"]],"be":["菜包、茶叶蛋","sp",["bun","egg"]],"bv":["菜包、茶叶蛋、黄瓜","spv",["bun","egg","cucumber"]],"s":["鸡蛋三明治","sp",["sandwich","egg"]],"sv":["鸡蛋三明治、黄瓜","spv",["sandwich","cucumber"]],"f":["水果盒、奶茶","",["apple","orange","tea"]],"fm":["水果、饭团、卤蛋","sp",["apple","rice","egg"]],"fv":["水果、饭团、卤蛋、黄瓜","spv",["apple","rice","egg","cucumber"]],"p":["白粥、咸菜","s",["porridge","pickle"]],"pe":["白粥、鸡蛋","sp",["porridge","egg"]],"pv":["小米粥、鸡蛋、青菜","spv",["porridge","egg","greens"]],"de":["双蛋煎饼","sp",["pancake","egg","egg"]],"dv":["煎饼、鸡蛋、青菜","spv",["pancake","egg","greens"]],"pn":["葱油拌面","s",["noodle","scallion"]],"sn":["葱油面、芝麻、香菜、辣椒","s",["noodle","scallion","spice"]],"fn":["鸡蛋青菜面","spv",["noodle","egg","greens"]],"vn":["青菜面","sv",["noodle","greens"]],"sa":["生菜、黄瓜、番茄","v",["greens","cucumber","tomato"]],"sf":["沙拉、鸡蛋、面包","spv",["greens","tomato","egg","bread"]],"c":["蛋糕、奶茶","s",["cake","tea"]],"cm":["三明治、蛋糕","sp",["sandwich","cake"]],"cf":["三明治、黄瓜、蛋糕","spv",["sandwich","cucumber","cake"]],"fi":["米饭、清蒸鱼","sp",["rice","fish"]],"ff":["米饭、清蒸鱼、青菜","spv",["rice","fish","greens"]],"rf":["红烧肉、米饭、苹果","sp",["rice","pork","apple"]],"ch":["炸鸡、薯条","sp",["chicken","fries"]],"cv":["炸鸡、米饭、西兰花","spv",["chicken","rice","greens"]],"so":["排骨汤、米饭（少量排骨）","s",["broth","rice","beef"]],"su":["排骨、青菜、米饭、汤","spv",["broth","beef","greens","rice"]],"fs":["水果、清汤","",["apple","orange","soup"]]};
function wpic(id){let items=M[id][2],shapes='';const col={rice:'#f0e5cc',noodle:'#e5bd79',beef:'#895d44',pork:'#a76c45',egg:'#f4ddb1',greens:'#698446',cucumber:'#91ab64',tomato:'#c96a4e',tofu:'#e9d7b6',soup:'#d0b47e',broth:'#b58a57',bun:'#eadcc0',sandwich:'#d8b77d',apple:'#ce775c',orange:'#eaa45c',tea:'#bc9d76',porridge:'#eee4cf',pickle:'#9b955d',pancake:'#d5a45e',scallion:'#6b8b48',spice:'#a66143',bread:'#d9b17b',cake:'#c2a388',fish:'#a9aaa0',chicken:'#c28a4e',fries:'#e7be70'};let k=0;for(let [j,item] of items.entries()){let a=j*Math.PI*2/items.length-.7,x=160+Math.cos(a)*(items.length===1?0:49),y=99+Math.sin(a)*(items.length===1?0:38);let color=col[item]||'#c6b48c';if(item==='noodle'){for(let n=0;n<18;n++){let yy=y-19+n*2.2;shapes+='<path d="M'+(x-38)+' '+yy+' q18 -16 36 0 t36 0" fill="none" stroke="'+(n%3?'#d8ac65':'#f0d18f')+'" stroke-width="3" stroke-linecap="round"/>'}}else if(['greens','scallion','cucumber','spice','pickle'].includes(item)){for(let n=0;n<(item==='scallion'||item==='spice'?6:17);n++){let xx=x+Math.sin(n*7)*24,yy=y+Math.cos(n*5)*18;shapes+='<ellipse cx="'+xx+'" cy="'+yy+'" rx="'+(item==='scallion'?4:9)+'" ry="'+(item==='scallion'?2:5)+'" fill="'+color+'" opacity="'+(.72+n%3*.1)+'" transform="rotate('+(n*41)+' '+xx+' '+yy+')"/>'}}else if(item==='egg'){shapes+='<ellipse cx="'+x+'" cy="'+y+'" rx="16" ry="22" fill="#f4e5c9" stroke="#bda886"/><circle cx="'+x+'" cy="'+y+'" r="10" fill="#dba64c"/>'}else if(['bun','apple','orange'].includes(item)){shapes+='<circle cx="'+x+'" cy="'+y+'" r="24" fill="'+color+'" stroke="#a99071"/><path d="M'+(x-8)+' '+(y-14)+'q8 -6 16 0" fill="none" stroke="#f8edd8" stroke-width="2"/>'}else if(['broth','soup','porridge','tea'].includes(item)){shapes+='<ellipse cx="'+x+'" cy="'+y+'" rx="35" ry="24" fill="'+color+'" stroke="#a78c68" stroke-width="3"/>'}else{let count=item==='rice'?18:6;for(let n=0;n<count;n++){let xx=x+Math.sin(n*5)*23,yy=y+Math.cos(n*3)*17;shapes+='<rect x="'+(xx-8)+'" y="'+(yy-5)+'" width="'+(item==='rice'?14:21)+'" height="'+(item==='rice'?7:14)+'" rx="4" fill="'+color+'" stroke="#9d8769" stroke-opacity=".25" transform="rotate('+(n*23)+' '+xx+' '+yy+')"/>'}}}
return '<svg class="mealpic" viewBox="0 0 320 200" role="img" aria-label="模拟餐食示意图"><rect width="320" height="200" rx="12" fill="#d2c4aa"/><path d="M0 29H320 M0 84H320 M0 149H320" stroke="#baaa8d" opacity=".45"/><ellipse cx="164" cy="105" rx="115" ry="81" fill="#90836e" opacity=".28"/><ellipse cx="160" cy="99" rx="110" ry="79" fill="#f9f6eb" stroke="#b5ab97" stroke-width="2"/><ellipse cx="160" cy="99" rx="94" ry="64" fill="#eee9d9" stroke="#d5cbb4"/>'+shapes+'<path d="M283 27L300 164 M289 26L306 163" stroke="#87674c" stroke-width="3" stroke-linecap="round"/></svg>'}

const N=['老妈','老爸','女儿','管家'],A=['妈','爸','女','助'];
const cards={
egg:{p:0,text:'肉不多的话，加个蛋也能补充蛋白质。',title:'加蛋补蛋白'},
veg:{p:2,text:'面照吃，能顺手搭份青菜就更丰富了。',title:'顺手加份菜'},
soup:{p:3,text:'汤里有部分营养，肉里的蛋白质也不能忽略。',title:'汤料都吃'},
balance:{p:3,text:'加蛋是个好办法，但蛋白质来源不能代替蔬菜和主食。',title:'鸡蛋不能包办'},
window:{p:2,text:'爸，下回选能一起打饭和菜的窗口，省得排两次队。',title:'一次打齐'},
fruit:{p:3,text:'水果和蔬菜各有营养特点，不能直接互相替代。',title:'水果不代菜'},
portable:{p:0,text:'忙的话，带点主食和鸡蛋，再找些方便吃的蔬菜。',title:'便携也搭配'},
fiber:{p:3,text:'蔬菜除了纤维，还有多种维生素和矿物质，不能只靠一种营养素代替。',title:'食物不只一种营养'},
};
function newGame(){return {day:0,pin:null,history:[],scenes:[],tags:{},habits:{},seen:[],turns:0,finished:false}}
function msg(p,text,extra={}){return {p,text,...extra}}
function tip(id){return {...cards[id],card:id}}
function tag(st,p,key,val){let old=st.tags[p+':'+key];if(old===val)return null;st.tags[p+':'+key]=val;if(!st.seen.includes(val))st.seen.push(val);return {system:N[p]+' · '+(old?'词条更新：'+old+' → '+val:'发现词条：'+val)}}
function habit(st,p,key,val){st.habits[p+':'+key]=val}
function add(arr,item){if(item)arr.push(item)}
function scene(st){
let d=st.day,k=st.pin,lines=[],id,diag,choices=[];
if(d===0){id='n';diag='牛肉量少，未见蔬菜；汤底用盐未知。';lines=[msg(1,'18块，肉就这么几片，汤我倒是喝完了。',{photo:id}),msg(0,'肉这么少，下午别饿了。'),tip('egg'),tip('veg'),tip('soup')];choices=['egg','veg','soup']}
if(d===1){
id=k==='veg'?'dv':'de';diag=id==='dv'?'有主食、蛋和蔬菜；仍需结合实际份量。':'有主食和蛋，未见明显蔬菜。';
if(k==='egg'){lines=[msg(1,'今天煎饼加俩蛋。昨天群里不是说了嘛，补蛋白质！',{photo:id,quote:cards.egg.text}),msg(1,'菜要另加钱，我就不加了。反正俩蛋。')];add(lines,tag(st,1,'protein','鸡蛋万能'))}
else if(k==='veg'){lines=[msg(1,'今天买煎饼时顺手让老板放了把菜，倒也不麻烦。',{photo:id,quote:cards.veg.text})];habit(st,1,'veg','顺手加菜');add(lines,tag(st,1,'veg','愿加配菜'))}
else if(k==='soup'){lines=[msg(1,'中午没喝汤，买了个双蛋煎饼。',{photo:id}),msg(0,'昨天群里那句我记着呢，下回炖汤不光给你们盛汤。',{quote:cards.soup.text})];habit(st,0,'soup','汤料都吃');add(lines,tag(st,0,'soup','汤料都吃'))}
else lines=[msg(1,'双蛋煎饼，还是楼下那家快。',{photo:id})];
lines.push(msg(2,'爸，你每次买饭就盯着方便。'),tip('balance'),tip('window'));if(k!=='soup')lines.push(tip('soup'));choices=['balance','window',...(k!=='soup'?['soup']:[])];
}
if(d===2){
let last=st.history[0]?.pin;
if(k==='balance'&&st.tags['1:protein']==='鸡蛋万能'){lines.push(msg(1,'今天盖饭加了菜。昨天那句说得对，蛋归蛋，菜归菜。',{photo:'rv',quote:cards.balance.text}));habit(st,1,'veg','蛋菜都吃');add(lines,tag(st,1,'protein','蛋菜各有用'))}
if(k==='window'){lines.push(msg(1,'换了个窗口，饭肉菜一起打，居然比原来快。',{photo:'rv',quote:cards.window.text}));habit(st,1,'veg','一次打齐');if(st.tags['1:protein']==='鸡蛋万能')lines.push(msg(1,'不过煎饼我还是加俩蛋就够了。'));add(lines,tag(st,1,'veg','方便也搭配'))}
if(k==='soup'&&last!=='soup'){lines.push(msg(0,'排骨汤，肉我单独装了一碗，晚上回来吃。',{photo:'su',quote:cards.soup.text}));habit(st,0,'soup','汤料都吃');add(lines,tag(st,0,'soup','汤料都吃'))}
id=k==='window'?'fm':'f';diag=id==='fm'?'已有水果、主食、蛋；未见蔬菜。':'有水果，未见明确主食、蛋鱼肉豆和蔬菜。';
if(k==='window'){lines.push(msg(2,'爸都能一次买齐，我也去便利店顺手买了个饭团和蛋。',{photo:id,quote:cards.window.text}));habit(st,2,'meal','便携正餐')}
else lines.push(msg(2,'今天课连着课，买了盒水果和奶茶。',{photo:id}));
if(last==='veg'){lines.push(msg(2,'群里说要多吃菜，我今天水果也挺多的，应该算吧？',{quote:cards.veg.text}));add(lines,tag(st,2,'fruit','水果代菜'))}
else if(last==='egg'){lines.push(msg(2,'要是我也加个蛋，是不是这顿就全了？',{quote:cards.egg.text}));add(lines,tag(st,2,'protein','鸡蛋万能'))}
else lines.push(msg(2,'水果最省事了，洗都不用洗。'));
lines.push(tip('fruit'),tip('portable'),tip('fiber'));choices=['fruit','portable','fiber']
}
if(d===3){
let old=st.history[0]?.pin,mid=st.history[1]?.pin;
if(k==='fruit'){lines.push(msg(2,'今天水果留到下午了，中午买了饭团和蛋，还有黄瓜。',{photo:'fv',quote:cards.fruit.text}));habit(st,2,'meal','蔬果分开安排');if(st.tags['2:fruit']==='水果代菜')add(lines,tag(st,2,'fruit','水果不代菜'));else add(lines,tag(st,2,'fruit','蔬果各有用'))}
else if(k==='portable'){lines.push(msg(2,'早上顺手装了饭团、蛋和黄瓜。居然没迟到。',{photo:'fv',quote:cards.portable.text}));habit(st,2,'meal','便携正餐');add(lines,tag(st,2,'meal','提前备餐'));if(st.tags['2:protein']==='鸡蛋万能')lines.push(msg(2,'不过我以后如果只带蛋，应该也行吧？'))}
else if(k==='fiber'){lines.push(msg(2,'我本来还想买纤维粉代替菜，看来还是得吃菜。',{photo:'fv',quote:cards.fiber.text}));habit(st,2,'meal','食物多样');add(lines,tag(st,2,'fiber','食物不只纤维'));if(st.tags['2:fruit']==='水果代菜')add(lines,tag(st,2,'fruit','水果不代菜'))}
else lines.push(msg(2,'今天又赶课，水果盒和奶茶，老样子。',{photo:'f'}));
if(st.habits['0:soup'])lines.push(msg(0,'晚饭排骨汤，排骨我都捞出来了。你们回来自己夹。',{photo:'su',quote:cards.soup.text}));else lines.push(msg(0,'晚上冬瓜汤，清淡点。',{photo:'rs'}));
if(st.habits['1:veg'])lines.push(msg(1,'我带一份菜回来，顺路。',{photo:'rv'}));else lines.push(msg(1,'我路上吃过了，不用留饭。',{photo:'r'}));
}
return {lines,id,diag,choices}
}
function start(){st=newGame();st.scenes.push(scene(st));render()}
function choose(id){if(st.finished||st.day>=3)return;let sc=st.scenes[st.day];if(id!=='keep'&&!sc.choices.includes(id))return;if(id!=='keep'){st.pin=id;st.turns++}st.history.push({day:st.day,pin:st.pin,changed:id!=='keep'});st.day++;st.scenes.push(scene(st));if(st.day===3)st.finished=true;render();document.getElementById('latest').scrollIntoView({behavior:'smooth',block:'start'})}
function escapeHTML(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function bubble(x,active){if(x.system)return '<div class="system">'+escapeHTML(x.system)+'</div>';let me=x.p===3;return '<div class="msg '+(me?'me':'')+'"><div class="avatar">'+A[x.p]+'</div><div class="content"><div class="name">'+N[x.p]+'</div>'+(x.photo?'<div class="photo">'+wpic(x.photo)+'<div class="mealname">'+escapeHTML(M[x.photo][0])+'</div></div>':'')+(x.quote?'<div class="quote">引用群置顶 · '+escapeHTML(x.quote)+'</div>':'')+'<div class="bubble">'+escapeHTML(x.text)+'</div>'+(active&&x.card?'<button class="pinBtn" onclick="choose(\''+x.card+'\')">↑ 置顶这条</button>':'')+'</div></div>'}
function report(){let habits=Object.entries(st.habits),mis=Object.entries(st.tags).filter(([k,v])=>['鸡蛋万能','水果代菜'].includes(v)),title=habits.length>=2&&!mis.length?'各有各的改变':habits.length>=2?'进步，但还有误会':habits.length?'一件小事开始改变':'原来的日子';return '<div class="result"><div class="eyebrow">三天后的家庭</div><h2>'+title+'</h2><div class="summary"><b>'+habits.length+'</b> 项实际改变　<b>'+mis.length+'</b> 个尚未澄清的误解</div>'+(habits.length?habits.map(([k,v])=>'<div class="resultrow">'+N[+k.split(':')[0]]+' <b>'+escapeHTML(v)+'</b></div>').join(''):'<p>家人暂时没有改变原来的饮食安排。</p>')+(mis.length?mis.map(([k,v])=>'<div class="resultrow warn">'+N[+k.split(':')[0]]+' <b>'+escapeHTML(v)+'</b></div>').join(''):'')+'<details><summary>发现的词条 '+st.seen.length+'</summary><p>'+st.seen.map(escapeHTML).join(' · ')+'</p></details><p class="note">这是虚构的行为分支，不代表真实营养达标或实际干预效果。</p><button class="primary" onclick="start()">重来一次，试试另一条路径</button></div>'}
function render(){let sc=st.scenes[st.day];document.getElementById('app').innerHTML='<header><div><small>饮食健康群聊管家 · 机制试验</small><h1>相亲相爱一家人（4）</h1></div><span class="day">DAY '+Math.min(st.day+1,3)+' / 3</span></header><div class="sticky"><div class="pinned"><span class="pinIcon">↑</span><div><small>群置顶 · 1 个位置</small><b>'+(st.pin?escapeHTML(cards[st.pin].text):'还没有置顶消息')+'</b></div></div><div class="progress"><span>本次置顶 '+st.turns+' 次</span><span>发现词条 '+st.seen.length+'</span></div></div><main>'+st.scenes.map((x,i)=>'<section '+(i===st.day?'id="latest"':'')+'><div class="time">'+['周一 12:42','周二 12:18','周三 12:32','周三 19:05'][i]+'</div>'+x.lines.map(m=>bubble(m,i===st.day&&!st.finished)).join('')+(i<st.day&&st.history[i]?.changed?'<div class="system">你置顶了「'+escapeHTML(cards[st.history[i].pin].title)+'」</div>':'')+'</section>').join('')+(st.finished?report():'<div class="decision"><details><summary>餐食观察</summary><p>'+escapeHTML(sc.diag)+'</p></details><div class="hint">选一条消息置顶，看看家人下次会怎么做。</div><button class="keep" onclick="choose(\'keep\')">'+(st.pin?'保留原置顶，继续':'不置顶，继续')+' →</button></div>')+'</main><footer><a href="latest.html">对比原实验版</a> · <a href="https://www.who.int/news-room/fact-sheets/detail/healthy-diet" target="_blank" rel="noopener">膳食知识依据</a></footer>'}
let st;

start();</script></body></html>
