'?14:21)+'" height="'+(item==='rice'?7:14)+'" rx="4" fill="'+color+'" stroke="#9d8769" stroke-opacity=".25" transform="rotate('+(n*23)+' '+xx+' '+yy+')"/>'}}}

hit:(x,y)=>[x.id,y.id].includes('dv'),resist:'可青菜要另外加钱，蛋就顺手打进去。我不能光听你们讲道理啊。',change:'要是老板能一起放菜，我就加一点。蛋还是留一个，挺香的。',later:'后来爸爸在同一家摊位试了单蛋加菜。他没有放弃自己爱吃的煎饼。',laterId:'dv',stay:'后来爸爸仍然点双蛋煎饼：不想多花时间和钱。',stayId:'de'},

function newState(){return {i:0,selected:[],tests:[],history:[],seen:[],done:false}}
function evaluate(c,indices){let pair=indices.map(i=>c.cards[i]);let own=pair.slice().sort(c.choose)[0],other=pair.slice().sort(c.otherChoose)[0],hit=c.hit(...pair);return {indices:indices.slice().sort(),own:own.id,other:other.id,reason:c.reason(own),reply:c.otherSay(other),contrast:c.contrast(...pair),hit,disagree:own.id!==other.id}}
function key(a){return a.slice().sort().join(',')}
function toggle(i){if(st.done||st.tests.length>=2)return;if(st.selected.includes(i))st.selected=st.selected.filter(x=>x!==i);else st.selected=st.selected.length===2?[st.selected[1],i]:[...st.selected,i];render()}
function test(){let c=CASES[st.i];if(st.selected.length!==2||st.tests.length>=2||st.tests.some(t=>key(t.indices)===key(st.selected)))return;let t=evaluate(c,st.selected);st.tests.push(t);st.selected=[];if(t.hit&&!st.seen.includes(c.tag))st.seen.push(c.tag);render()}
