{id:'hatefruit',p:2,label:'不喜欢鲜果',val:'neutral',need:[],counter:['5:a','5:d'],fact:'如果是不喜欢鲜果的口感，也可以试试不同品种。',topic:'carry'}
];
hypotheses.push({id:'no_fish',p:0,label:'不喜欢鱼',val:'neutral',need:[],counter:['4:b'],fact:'如果你不喜欢鱼，也可以考虑其他蛋肉豆类。',topic:'comfort'});
const byId=id=>hypotheses.find(h=>h.id===id), valName={negative:'负面',neutral:'中性',positive:'正面'}, actionName={negative:'纠正',neutral:'解释',positive:'强调'};
let st;
function getScene(x){return scenes[x.i]}
function seedLines(i,x){let lines=scenes[i].lines.map(([p,t,id],j)=>[p,t,i+':'+(id||'x'+j)]);if(x&&i===3&&x.outcomes.chew?.practical)lines.push([1,'上次说的豆腐我记着了，改天试试那个窗口。',i+':echo']);if(x&&i===4&&(x.outcomes.comfort?.practical||x.outcomes.onepot?.practical))lines.push([0,'上回说一锅煮的办法我试了，倒真省事。',i+':echo']);if(x&&i===5&&x.outcomes.carry?.practical)lines.push([2,'上回说下午吃水果，我今天就是这么安排的。',i+':echo']);return lines}
function make(){return {i:0,attention:3,lines:seedLines(0),past:[],evidence:{},marked:[],tags:[],selected:[],person:1,filter:'all',notice:'',history:[],used:[],outcomes:{},done:false}}
function getLine(x,id){return x.lines.find(l=>l[2]===id)||x.past.flatMap(a=>a.lines).find(l=>l[2]===id)}
function collectState(x,id){let l=getLine(x,id);if(!l||l[0]>=3||x.evidence[id])return false;x.evidence[id]={id,p:l[0],text:l[1],day:Number(id.split(':')[0])};x.notice='';return true}
function markState(x,id){if(!x.evidence[id])return false;if(x.marked.includes(id))x.marked=x.marked.filter(v=>v!==id);else if(x.marked.length<3)x.marked.push(id);else return false;return true}
function assess(h,ids){if(h.counter?.some(k=>ids.includes(k)))return '需修订';if(h.need.some(group=>group.every(k=>ids.includes(k))))return '已支持';return '待验证'}
function proposeState(x,id){let h=byId(id);if(!h||!x.marked.length)return false;let t=x.tags.find(t=>t.id===id);if(t){t.ids=[...new Set([...t.ids,...x.marked])];t.status='待验证';t.checkAfter=x.i+1}else{x.tags.push({id,ids:x.marked.slice(),status:'待验证',checkAfter:x.i+1})}x.marked=[];x.notice='已记录推断，后续观察再验证。';return true}
function verify(x){let notices=[];for(let t of x.tags){if(t.checkAfter>x.i||t.status!=='待验证')continue;let h=byId(t.id),v=assess(h,t.ids);if(v!==t.status){t.status=v;notices.push([9,(v==='已支持'?'词条获得证据支持：':'词条需要修订：')+N[h.p]+' · '+h.label])}}return notices}
function draft(x){let ts=x.selected.map(id=>x.tags.find(t=>t.id===id)).filter(Boolean),hs=ts.map(t=>byId(t.id));if(!hs.length)return null;let p=hs[0].p;if(hs.some(h=>h.p!==p))return {blocked:true,text:'这次先和一位家人聊。',cost:0};return {p,ids:hs.map(h=>h.id),ts,hs,text:hs.map(h=>h.fact).join(' '),cost:hs.length,kind:hs.map(h=>actionName[h.val]).join('＋')}}
function sendState(x){let d=draft(x);if(!d||d.blocked||x.attention<d.cost||d.ids.some(id=>x.used.includes(id)))return false;x.attention-=d.cost;x.used.push(...d.ids);x.lines.push([3,d.text]);let c=getScene(x),relevant=d.p===c.p,parts=[],log=[];
for(let h of d.hs){let t=x.tags.find(t=>t.id===h.id),support=assess(h,t.ids),out=x.outcomes[h.id]||(x.outcomes[h.id]={talked:0,understood:false,reinforced:false,practical:false});out.talked++;
if(support==='需修订'||!h.need.length){parts.push(h.p===1?'我没说不吃肉啊，就是那块太柴。':h.p===0?'清蒸鱼我也喜欢，只是那天胃口一般。':'我可没说不爱吃水果，赶时间而已。');log.push('人物不认同你的判断');continue}
if(support==='待验证'){parts.push(h.p===1?'你先别替我下结论，我也得看当天吃什么。':h.p===0?'你说的也不一定是我那天的意思。':'也不全是这么回事吧。');log.push('证据不足，人物保留意见');continue}
if(h.id==='comfort'&&x.i>=4){parts.push('那天是胃口一般，今天已经好多了。');log.push('临时状态已变');continue}
if(!relevant){parts.push(h.p===0?'我这会儿在忙，晚点再聊。':h.p===1?'我先把手上的事办完，吃饭时再说。':'我在上课，晚点看。');log.push('时机不合适');continue}
if(h.val==='negative'){out.understood=true;parts.push(x.i<3?cases[x.i].resist:h.id==='light'?'我现在清蒸鱼也吃，你别把我喝粥当成顿顿只喝粥呀。':h.id==='soup'?'汤还是爱喝，肉太柴的话我就换豆腐。':'我知道不完全一样，但早上还是要方便。');log.push('理解不等于行动')}
if(h.val==='neutral'){out.practical=true;parts.push(x.i<3?cases[x.i].follow:h.p===1?'有合适的嫩豆腐我就换，不一定每天都有。':h.p===0?'一锅煮倒是可以，看当天胃口。':'苹果好带，别的水果我下午再吃。');log.push('回应生活条件')}
if(h.val==='positive'){out.reinforced=true;parts.push(h.p===0?'这个我本来就喜欢，今天正好有胃口。':h.p===1?'豆腐好吃才会点，不是为了完成什么任务。':'今天有空才吃的，忙起来还是得想办法。');log.push('强化已有行为')}
}
for(let [j,t] of [...new Set(parts)].entries())x.lines.push([d.p,t,x.i+':r'+x.used.length+'_'+j]);
if(relevant&&x.i<3&&!getLine(x,x.i+':e'))x.lines.push([d.p,cases[x.i].follow,x.i+':e']);
x.lines.push([9,'注意力 −'+d.cost+' · '+x.attention+'/3']);x.history.push({day:x.i,ids:d.ids,log});x.selected=[];return true}
function advance(x){x.past.push({i:x.i,lines:x.lines.slice()});x.i++;x.marked=[];x.selected=[];x.used=[];x.notice='';if(x.i===scenes.length){x.lines=[];x.lines.push(...verify(x));x.done=true;return x}x.attention=3;x.person=scenes[x.i].p;x.lines=seedLines(x.i,x);x.lines.unshift(...verify(x));return x}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function collect(id){collectState(st,id);render(true)}
function mark(id){if(!markState(st,id))st.notice='每次最多选择3条证据。';render(true)}
function propose(id){proposeState(st,id);render(true)}
function removeTag(id){st.tags=st.tags.filter(t=>t.id!==id);st.selected=st.selected.filter(k=>k!==id);render(true)}
function choose(id){if(st.selected.includes(id))st.selected=st.selected.filter(k=>k!==id);else if(st.selected.length<2)st.selected.push(id);else st.selected=[st.selected[1],id];render(true)}
function setPerson(p){st.person=p;render(true)}
function filter(v){st.filter=v;render(true)}
function send(){if(sendState(st))render(false)}
function next(){advance(st);render(false)}
function restart(){st=make();render(false)}
function dropClue(e){e.preventDefault();let id=e.dataTransfer.getData('text/plain');collect(id)}
function message(l){let [p,t,id]=l;if(p===9)return '<div class="system">'+esc(t)+'</div>';let can=p<3&&id,saved=!!st.evidence[id];return '<div class="msg '+(p===3?'me':'')+'"><span class="avatar">'+A[p]+'</span><div class="content"><small>'+N[p]+'</small><div class="bubble '+(can?'clue':'')+(saved?' saved':'')+'" '+(can?'draggable="true" ondragstart="event.dataTransfer.setData(\'text/plain\',\''+id+'\')" role="button" tabindex="0" onclick="collect(\''+id+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();collect(\''+id+'\')}"':'')+'>'+esc(t)+'</div></div></div>'}
function photo(id){return '<div class="photo">'+wpic(id)+'<small>'+esc(M[id][0])+'</small></div>'}
function board(){let ev=Object.values(st.evidence).filter(e=>st.filter==='all'||e.p===Number(st.filter)||st.marked.includes(e.id));return '<aside ondragover="event.preventDefault()" ondrop="dropClue(event)"><h2>线索板 <small>'+Object.keys(st.evidence).length+' 条</small></h2><p class="hint">点击或拖入任意家人消息。选证据，再提出判断。</p><div class="filters">'+['all',0,1,2].map(p=>'<button class="'+(String(st.filter)===String(p)?'active':'')+'" onclick="filter(\''+p+'\')">'+(p==='all'?'全部':N[p])+'</button>').join('')+'</div><div class="pending">'+(ev.length?ev.map(e=>'<button class="evidence '+(st.marked.includes(e.id)?'marked':'')+'" onclick="mark(\''+e.id+'\')"><small>第'+(e.day+1)+'段 · '+N[e.p]+'</small><span>'+esc(e.text)+'</span></button>').join(''):'<div class="empty">还没有证据</div>')+'</div><div class="infer"><h2>提出推断 <small>'+st.marked.length+'/3</small></h2><div class="filters">'+[0,1,2].map(p=>'<button class="'+(p===st.person?'active':'')+'" onclick="setPerson('+p+')">'+N[p]+'</button>').join('')+'</div><div class="hypotheses">'+hypotheses.filter(h=>h.p===st.person).map(h=>'<button '+(!st.marked.length?'disabled':'')+' onclick="propose(\''+h.id+'\')">'+esc(h.label)+'</button>').join('')+'</div></div><h2>人物词条 <small>'+st.tags.length+'</small></h2><div class="taglist">'+(st.tags.length?st.tags.map(t=>{let h=byId(t.id);return '<div class="tag"><button class="'+h.val+(st.selected.includes(t.id)?' selected':'')+'" onclick="choose(\''+t.id+'\')"><small>'+N[h.p]+' · '+valName[h.val]+'</small><b>'+esc(h.label)+'</b></button><details><summary>'+t.status+' · '+t.ids.length+' 条依据</summary>'+t.ids.map(id=>'<p>'+esc(st.evidence[id]?.text)+'</p>').join('')+'<button onclick="removeTag(\''+t.id+'\')">撤回推断</button></details></div>'}).join(''):'<p class="hint">暂无词条</p>')+'</div>'+(st.notice?'<p class="hint">'+esc(st.notice)+'</p>':'')+'</aside>'}
function report(){let supported=st.tags.filter(t=>t.status==='已支持'),pending=st.tags.filter(t=>t.status==='待验证'),rev=st.tags.filter(t=>t.status==='需修订');return '<div class="report"><h1>家庭观察档案</h1><p>记录 '+Object.keys(st.evidence).length+' 条原话，形成 '+st.tags.length+' 个推断。</p><p>'+supported.length+' 个有支持证据 · '+pending.length+' 个待验证 · '+rev.length+' 个需修订</p>'+[0,1,2].map(p=>'<div class="receipt"><b>'+N[p]+'</b>'+st.tags.filter(t=>byId(t.id).p===p).map(t=>{let h=byId(t.id),o=st.outcomes[t.id];return '<p>'+esc(h.label)+' · '+t.status+(o?.understood?' · 听到解释':'')+(o?.practical?' · 讨论过可行办法':'')+(o?.reinforced?' · 强调过已有行为':'')+'</p><details><summary>原话依据</summary>'+t.ids.map(id=>'<p>'+esc(st.evidence[id]?.text)+'</p>').join('')+'</details>'}).join('')+'</div>').join('')+'<p class="hint">虚构情境、预设证据与反馈，不代表真实营养状况或实际干预结果。</p><button class="primary" onclick="restart()">重新观察</button></div>'}
function render(preserve){let old=document.getElementById('chat'),y=old?.scrollTop||0,c=getScene(st),d=st.done?null:draft(st);document.getElementById('app').innerHTML='<header><div><small>饮食健康群聊管家 · 线索推理</small><h1>相亲相爱一家人（4）</h1></div><b>'+Math.min(st.i+1,6)+'/6</b></header>'+(st.done?report():'<div class="layout">'+board()+'<section><div class="chat" id="chat"><details class="past"><summary>之前的群聊（'+st.past.length+'段）</summary>'+st.past.map(a=>'<div class="system">'+scenes[a.i].time+'</div>'+a.lines.map(message).join('')).join('')+'</details><div class="system">'+c.time+'</div><div class="msg"><span class="avatar">'+A[c.p]+'</span><div><small>'+N[c.p]+'</small>'+photo(c.meal)+'</div></div>'+st.lines.map(message).join('')+'</div><div class="controls"><details><summary>餐食观察</summary><p>'+esc(c.diag)+'</p></details><div class="attention">注意力 '+[0,1,2].map(i=>'<i class="'+(i<st.attention?'on':'')+'"></i>').join('')+'<b>'+st.attention+'/3</b></div>'+(d?'<div class="preview"><small>'+esc(d.blocked?'':N[d.p]+' · '+d.kind)+'</small><p>'+esc(d.text)+'</p></div>':'<p class="hint">选择人物词条生成回复，也可以只观察。</p>')+'<div class="buttons"><button onclick="next()">继续观察 →</button><button class="primary" '+(!d||d.blocked||st.attention<d.cost||d.ids.some(id=>st.used.includes(id))?'disabled':'onclick="send()"')+'>发送'+(d&&!d.blocked?' · '+d.cost+' 格':'')+'</button></div></div></section></div>')+'<footer><a href="latest.html">返回完整旧版</a> · <a href="https://dg.cnsoc.org/article/04/J4-AsD_DR3OLQMnHG0-jZA.html">膳食指南</a></footer>';let ch=document.getElementById('chat');if(ch)ch.scrollTop=preserve?y:0}
