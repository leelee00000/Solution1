const people=[{"name":"老妈","short":"妈","age":48,"history":"小时候跟外婆住，家里喝粥、炖汤。现在做财务，买菜讲究实惠，喜欢提前备好家人的饭。","taste":"热粥、炖汤、家常菜","belief":"吃得清淡就舒服；汤里的精华值得喝；家人吃一样比较省心。","base":{"v":0,"soup":-1,"light":-1,"fruit":0,"time":0,"portion":0,"source":0,"freq":0,"value":0}},{"name":"老爸","short":"爸","age":50,"history":"以前在工厂轮班，现在常在单位食堂吃饭。小时候家里买肉少，觉得一顿饭得吃得实在。","taste":"肉包、面条、红烧菜、浓汤","belief":"吃饱才有劲；汤底够味就很满足；特别的日子可以破例。","base":{"v":-1,"soup":0,"light":0,"fruit":-1,"time":0,"portion":-1,"source":0,"freq":-1,"value":0}},{"name":"女儿","short":"女","age":20,"history":"大学住校，早课赶时间，和室友点外卖。周末回家，爱研究好吃又方便的新东西。","taste":"面包、水果、奶茶、便利店简餐","belief":"水果最省事；看起来清爽就比较安心；很多饮食选择取决于时间。","base":{"v":0,"soup":0,"light":0,"fruit":-1,"time":-1,"portion":0,"source":0,"freq":-1,"value":0}}],groups=[{"title":"家常起步","mission":"把这一家人的三餐理顺","desc":"早餐、家常汤、校园午餐","cases":[{"id":"porridge","p":0,"slot":0,"axis":"light","title":"早上喝点热的","open":[[0,"早上起来胃里空空的，还是白粥舒服。我小时候外婆天天熬。",-1],[1,"我带两个包子走，粥到单位就饿了。",0],[2,"妈，冰箱还有昨晚你给我留的鸡蛋呢。",1]],"a":["热粥配个鸡蛋怎么样？",2],"b":["早上喝热粥挺舒服的。",-1],"good":[[0,"行，鸡蛋放碗里就好，省得另外洗盘子。",1],[1,"那也给我留一个，我下午带走。",0]],"bad":[[0,"我喝两碗就饱了，鸡蛋你们拿去吧。",-1],[2,"我感觉鸡蛋在我们家每天都被转让。",0]],"second":["以前喝粥还会配什么？",2],"habit":["白粥、馒头","s"],"better":["小米粥、鸡蛋、牛奶","spm"],"q0":"一大碗粥，热乎就踏实。","q1":"还是外婆那口粥，鸡蛋也没剩。","disc":"一碗粥包办早餐","secondWarm":["这个搭配挺合适。",1]},{"id":"broth","p":1,"slot":2,"axis":"soup","title":"爸爸的汤碗","open":[[1,"今天食堂那锅排骨汤不错，我打了一大碗。肉留给同事了。",-1],[0,"你那不是排骨汤吗，怎么只剩汤？",1],[2,"爸是负责喝汤的，排骨有自己的同事。",0]],"a":["汤和排骨一起吃也不错。",2],"b":["喝碗热汤确实舒服。",-1],"good":[[1,"行吧，肉吃两块，汤也照喝。",1],[0,"青菜也拿点，上次你说那个炒菜挺好吃。",1]],"bad":[[1,"主要是汤够味，吃肉还得吐骨头。",-1],[2,"你是来食堂追求无障碍用餐的。",0]],"second":["只喝汤，下午会饿吗？",2],"habit":["米饭、排骨汤（少量固形物）","s"],"better":["米饭、排骨、青菜、汤","spv"],"q0":"今天喝了两碗汤，舒服。","q1":"排骨这次没让给同事，配了青菜。","disc":"汤碗里的精华","secondWarm":["这样汤和肉都吃到了。",1]},{"id":"fruitlunch","p":2,"slot":1,"axis":"fruit","title":"图书馆楼下","open":[[2,"图书馆楼下切好的水果超方便，今天午饭就它了。",-1],[0,"你上午就吃了片面包吧？下午还有课吗？",1],[1,"我中午也吃水果，跟食堂的饭一起吃。",1]],"a":["水果配个饭团，下午更顶饿。",2],"b":["切好的水果确实方便 function wprofiles(){wstop();app.innerHTML='<div class="end"><h1>家庭成员</h1>'+people.map(p=>'<div class="person"><h2>'+p.name+' · '+p.age+'岁</h2><p>'+p.history+'</p><p>喜欢：'+p.taste+'</p><p>相信：'+p.belief+'</p></div>').join('')+'<div class="actions"><button onclick="whome()">返回</button></div></div>'}
function wstart(){wstop();wr=wnew(wm.attempt%2,wm.up);wr.rng=(1234567+wm.attempt*7919)>>>0;wr.history=[];wbegin()}
function wbegin(){wstop();wr.lines=wrecord(wr);wr.shown=0;wr.done=false;wr.pending=false;wr.selected=[];wreveal()}
function wpic(id){let items=M[id][2],shapes='';const col={rice:'#f0e5cc',noodle:'#e5bd79',beef:'#895d44',pork:'#a76c45',egg:'#f4ddb1',greens:'#698446',cucumber:'#91ab64',tomato:'#c96a4e',tofu:'#e9d7b6',soup:'#d0b47e',broth:'#b58a57',bun:'#eadcc0',sandwich:'#d8b77d',apple:'#ce775c',orange:'#eaa45c',tea:'#bc9d76',porridge:'#eee4cf',pickle:'#9b955d',pancake:'#d5a45e',scallion:'#6b8b48',spice:'#a66143',bread:'#d9b17b',cake:'#c2a388',fish:'#a9aaa0',chicken:'#c28a4e',fries:'#e7be70'};let k=0;for(let [j,item] of items.entries()){let a=j*Math.PI*2/items.length-.7,x=160+Math.cos(a)*(items.length===1?0:49),y=99+Math.sin(a)*(items.length===1?0:38);let color=col[item]||'#c6b48c';if(item==='noodle'){for(let n=0;n<18;n++){let yy=y-19+n*2.2;shapes+='<path d="M'+(x-38)+' '+yy+' q18 -16 36 0 t36 0" fill="none" stroke="'+(n%3?'#d8ac65':'#f0d18f')+'" stroke-width="3" stroke-linecap="round"/>'}}else if(['greens','scallion','cucumber','spice','pickle'].includes(item)){for(let n=0;n<(item==='scallion'||item==='spice'?6:17);n++){let xx=x+Math.sin(n*7)*24,yy=y+Math.cos(n*5)*18;shapes+='<ellipse cx="'+xx+'" cy="'+yy+'" rx="'+(item==='scallion'?4:9)+'" ry="'+(item==='scallion'?2:5)+'" fill="'+color+'" opacity="'+(.72+n%3*.1)+'" transform="rotate('+(n*41)+' '+xx+' '+yy+')"/>'}}else if(item==='egg'){shapes+='<ellipse cx="'+x+'" cy="'+y+'" rx="16" ry="22" fill="#f4e5c9" stroke="#bda886"/><circle cx="'+x+'" cy="'+y+'" r="10" fill="#dba64c"/>'}else if(['bun','apple','orange'].includes(item)){shapes+='<circle cx="'+x+'" cy="'+y+'" r="24" fill="'+color+'" stroke="#a99071"/><path d="M'+(x-8)+' '+(y-14)+'q8 -6 16 0" fill="none" stroke="#f8edd8" stroke-width="2"/>'}else if(['broth','soup','porridge','tea'].includes(item)){shapes+='<ellipse cx="'+x+'" cy="'+y+'" rx="35" ry="24" fill="'+color+'" stroke="#a78c68" stroke-width="3"/>'}else{let count=item==='rice'?18:6;for(let n=0;n<count;n++){let xx=x+Math.sin(n*5)*23,yy=y+Math.cos(n*3)*17;shapes+='<rect x="'+(xx-8)+'" y="'+(yy-5)+'" width="'+(item==='rice'?14:21)+'" height="'+(item==='rice'?7:14)+'" rx="4" fill="'+color+'" stroke="#9d8769" stroke-opacity=".25" transform="rotate('+(n*23)+' '+xx+' '+yy+')"/>'}}}
return '<svg class="mealpic" viewBox="0 0 320 200" role="img" aria-label="模拟餐食示意图"><rect width="320" height="200" rx="12" fill="#d2c4aa"/><path d="M0 29H320 M0 84H320 M0 149H320" stroke="#baaa8d" opacity=".45"/><ellipse cx="164" cy="105" rx="115" ry="81" fill="#90836e" opacity=".28"/><ellipse cx="160" cy="99" rx="110" ry="79" fill="#f9f6eb" stroke="#b5ab97" stroke-width="2"/><ellipse cx="160" cy="99" rx="94" ry="64" fill="#eee9d9" stroke="#d5cbb4"/>'+shapes+'<path d="M283 27L300 164 M289 26L306 163" stroke="#87674c" stroke-width="3" stroke-linecap="round"/></svg>'}
function wmsg(m,i,active){let me=m.p===3;return '<div class="msg '+(me?'me':'')+'"><div class="avatar">'+(me?'助':ws[m.p])+'</div><div><div class="name">'+(me?'管家':wn[m.p])+'</div>'+(m.photo?wpic(m.photo):'<div class="bubble">'+m.text+'</div>')+(!me&&m.fx&&(active||m.liked)?'<button class="like '+(m.liked?'chosen':'')+'" '+(m.liked||!active||!wr.likes||wr.done||wr.i>=12?'disabled':'onclick="wlike('+i+')"')+'>'+(m.liked?'♥':'♡')+'</button>':'')+'</div></div>'}
function wreveal(){wstop();if(!wr||wr.shown>=wr.lines.length)return;wr.shown++;wplay();if(wmode&&wr.shown<wr.lines.length){let st=wr;wtimer=setTimeout(()=>{if(wr===st)wreveal()},1000)}}
function wtoggle(){wstop();wmode=!wmode;wplay();if(wmode&&wr.shown<wr.lines.length)wtimer=setTimeout(wreveal,1000)}
function wcolumns(){return '<div class="wcolumns">'+[['肯定','强化已有好行为'],['建议','提供具体行动'],['知识','建立理解']].map(([type,desc])=>'<div class="wcol"><div class="wcolhead"><b>'+type+'</b><small>'+desc+'</small></div>'+wr.points.map((q,j)=>q[3]!==type?'':'<button class="wpoint '+(wr.selected.includes(j)?'selected':'')+'" '+(!wr.words||(!wr.selected.includes(j)&&wr.selected.length>=2)?'disabled':'onclick="wselect('+j+')"')+' aria-pressed="'+wr.selected.includes(j)+'"><span>'+(wr.selected.includes(j)?'✓':'○')+'</span>'+q[0].replace(/^肯定 · /,'')+'</button>').join('')+'</div>').join('')+'</div>'}
function wbudget(){let max=8+(wr.up.includes('words')?1:0),warn=wr.words<=2;return '<div class="wbudget '+(warn?'low':'')+'"><div><small>本周剩余发言</small><div><b>'+wr.words+'</b><span> / '+max+' 次</span></div></div><div class="wbudgetmid"><div class="wticks">'+Array.from({length:max},(_,i)=>'<i class="'+(i<wr.words?'filled':'')+'"></i>').join('')+'</div><small>'+(warn&&wr.words?'发言即将用完':wr.words?'还有 '+Math.max(0,11-wr.i)+' 次可介入晒饭':'发言已用完，仍可点赞')+'</small></div><div><small>剩余点赞</small><div><b>'+wr.likes+'</b><span> 次</span></div></div></div>'}
function wplay(){let e=E[wr.i],ready=wr.shown>=wr.lines.length,offline=wr.i>=12,clues='';if(wm.up.includes('history')&&wr.i>0){let prior=wr.meals[wr.i-1];clues='<div class="receipt"><small>授权 · 上一餐</small>'+prior.map((id,i)=>'<p class="small-meal">'+wn[i]+'：'+M[id][0]+'</p>').join('')+'</div>'}if(wm.up.includes('context'))clues+='<div class="receipt"><small>授权 · 今日生活线索</small><p>'+ (wr.seed?'女儿本周课程较满，便捷餐更常见。':'女儿本周时间较宽裕。')+'</p></div>';let opts=(!ready)?'<button class="primary" onclick="wreveal()">下一条消息 →</button>':wr.done||offline?'<button class="primary" onclick="wnext()">'+(wr.i===13?'查看一周报告':'下一次晒饭')+' →</button>': '<small>选1–2条回应，合并发送</small>'+wcolumns()+(wr.selected.length?'<div class="wpreview"><small>拟发送</small><div>'+wcompose(wr,wr.selected)+'</div></div>':'')+'<div class="wcontrols"><button onclick="wskip()">保持沉默</button><button class="primary" '+(!wr.words||!wr.selected.length?'disabled':'onclick="wsay()"')+'>发送 · 消耗1次</button></div>';
app.innerHTML='<div class="layout"><aside class="side"><small>DAY '+(Math.floor(wr.i/2)+1)+' / 7</small><h2>本周观察</h2><p>发言 <b>'+wr.words+'</b>　♡ <b>'+wr.likes+'</b></p><small>已记录 '+wr.meals.length*3+'/42 餐</small><p class="muted">餐图为模拟示意</p><div class="divider"></div><p class="muted">'+(offline?'助手离线，观察自主选择。':'餐食已经发生，建议影响未来。')+'</p>'+clues+'<div class="actions"><button onclick="whome()">返回</button></div></aside><section><div class="row"><div><small>'+e.t+'</small><h2 style="margin:6px 0">相亲相爱一家人（4）</h2></div><button class="wsmall" onclick="wtoggle()">'+(wmode?'自动 1秒':'手动点击')+'</button></div>'+wbudget()+'<div class="chat wchat" id="wchat">'+wr.history.map(h=>'<div class="wtime">'+h.t+'</div>'+h.lines.map((m,i)=>wmsg(m,i,false)).join('')).join('')+'<div class="wtime">'+e.t+'</div>'+wr.lines.slice(0,wr.shown).map((m,i)=>wmsg(m,i,ready&&!offline)).join('')+'</div><div class="options"><small>'+(offline?'离线观察':ready?'本次晒饭已结束':'消息接收中…')+'</small>'+opts+'</div></section></div>';let el=$('wchat');el.scrollTop=el.scrollHeight}
function wlike(i){if(!wr||wr.done||wr.i>=12||!wr.likes||wr.shown<wr.lines.length)return;let m=wr.lines[i];if(!m||!m.fx)return;wact(wr,{type:'like',line:m});m.liked=true;wr.done=true;wplay()}
function wselect(j){if(!wr||wr.done||wr.i>=12||!wr.words||wr.shown<wr.lines.length||!wr.points[j])return;let ix=wr.selected.indexOf(j);if(ix>=0)wr.selected.splice(ix,1);else if(wr.selected.length<2)wr.selected.push(j);wplay()}
function wsay(){if(!wr||wr.done||wr.i>=12||!wr.words||wr.shown<wr.lines.length||!wr.selected.length)return;let ids=wr.selected.slice(),text=wcompose(wr,ids);wact(wr,{type:'say',ids});wr.done=true;wr.lines.push({p:3,text});wr.shown=wr.lines.length;let replies=wreply(wr,ids);wr.lines.push(...replies);wplay();if(wmode&&replies.length)wtimer=setTimeout(wreveal,1000)}
function wskip(){if(!wr||wr.done||wr.shown<wr.lines.length)return;wr.done=true;wplay()}
function wnext(){if(!wr||wr.shown<wr.lines.length||(!wr.done&&wr.i<12))return;wstop();wr.history.push({t:E[wr.i].t,lines:wr.lines});if(wr.i===13){wsettle();return}wr.i++;wbegin()}
function wmealcard(id,i){return '<div class="receipt"><small>'+wn[i]+'</small><p>'+M[id][0]+'</p><small>'+['主食','蛋鱼肉豆','蔬菜'].filter((_,j)=>M[id][1].includes('spv'[j])).join(' · ')+'</small><p><b>'+M[id][1].length+'/3</b></p></div>'}
function wsettle(){if(wr.settled)return;wr.settled=true;let z=wscore(wr),f=[...new Set(wr.found)],nf=f.filter(x=>!wm.found.includes(x));wm.found.push(...nf);let reward=Math.max(0,z.total-wm.best)+nf.length+(z.pass&&!wm.passed?3:0);wm.xp+=reward;wm.best=Math.max(wm.best,z.total);wm.passed=wm.passed||z.pass;wm.attempt++;wsave();app.innerHTML='<div class="end"><small>一周午晚餐报告</small><h1>'+(z.pass?'委托达成':'继续调整')+'</h1><div class="receipt"><div class="big-number">'+z.total+'/126</div><small>目标110 · 每人至少34</small></div>'+z.per.map((n,i)=>'<div class="check"><b>'+wn[i]+'</b><span>'+n+'/42 '+(n>=34?'✓':'△')+'</span></div>').join('')+(f.length?'<div class="receipt"><b>观念回响</b>'+f.map(x=>{let r=KR.find(q=>q.id===x);return r?'<p><b>'+r.name+'</b> · '+r.kind+'</p><small>'+r.fix+'</small>':'<p>'+x+'</p>'}).join('')+'</div>':'')+'<details><summary>查看42份实际模拟餐食</summary>'+wr.meals.map((d,i)=>'<p>'+E[i].t+'</p><div class="data-grid">'+d.map(wmealcard).join('')+'</div>').join('')+'</details><details><summary>我的干预记录</summary>'+wr.trace.map(a=>'<p>'+E[a.i].t+' · '+a.text+'</p>').join('')+'</details><p>✦ +'+reward+' 经验</p><p class="muted">类别覆盖是游戏简化指标，不代表真实营养达标。</p><div class="actions"><button onclick="wstart()">重新观察</button><button onclick="wshop()">授权与能力</button><button class="primary" onclick="whome()">返回</button></div></div>'}
const wu=[['history','餐食记录授权','提前看到上一餐的三人记录',5],['context','生活信息授权','查看额外生活条件',5],['words','发言机会','每周增加一次发言',8],['likes','静默回应','每周增加一次点赞',6]];
function wshop(){wstop();app.innerHTML='<div class="end"><h1>授权与能力</h1>'+wu.map((u,i)=>'<div class="receipt row"><div><b>'+u[1]+'</b><p>'+u[2]+'</p></div><button '+(wm.up.includes(u[0])||wm.xp<u[3]?'disabled':'onclick="wbuy('+i+')"')+'>'+(wm.up.includes(u[0])?'已授权':'✦ '+u[3])+'</button></div>').join('')+'<div class="actions"><button onclick="whome()">返回</button></div></div>'}
function wbuy(i){let u=wu[i];if(wm.up.includes(u[0])||wm.xp<u[3])return;wm.xp-=u[3];wm.up.push(u[0]);wsave();wshop()}
function walbum(){wstop();app.innerHTML='<div class="end"><small>局外 · 认知数据库</small><h1>误解观察档案</h1><p>发现后解锁误解成因与科学解释。</p>'+KR.map(r=>'<div class="receipt">'+(wm.found.includes(r.id)?'<small>'+r.kind+'</small><h2>'+r.name+'</h2><p>虚构误解：“'+r.cue+'”</p><p>'+r.fix+'</p><small>关联知识：'+r.parents.map(k=>WK.find(q=>q.id===k).name).join(' · ')+'</small>':'<small>'+r.kind+'</small><p>？ 尚未发现</p>')+'</div>').join('')+'<details><summary>科学知识与依据</summary>'+WK.map(k=>'<div class="receipt"><b>'+k.name+'</b><p>'+k.fact+'</p><small>'+k.condition+'</small></div>').join('')+'<p><a href="https://dg.cnsoc.org/article/04/J4-AsD_DR3OLQMnHG0-jZA.html">中国居民膳食指南（2022）</a> · <a href="https://www.who.int/news-room/fact-sheets/detail/healthy-diet">WHO Healthy diet</a></p></details><div class="actions"><button onclick="whome()">返回</button></div></div>'}
whome();
</script></body></html>
