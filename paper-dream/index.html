let meta={xp:0,up:[],found:[],mastered:[],seen:[],best:{}};try{let m=JSON.parse(localStorage.getItem('food-game-campaign-v2'));if(m&&Array.isArray(m.mastered)&&Array.isArray(m.up)&&Array.isArray(m.found)&&Array.isArray(m.seen))meta=m;else{let v=JSON.parse(localStorage.getItem('food-game-mission-v1'));if(v){meta.xp=Math.max(0,Number(v.xp)||0);meta.up=Array.isArray(v.up)?v.up.filter(x=>['speech','style','patience'].includes(x)):[];meta.found=Array.isArray(v.found)?v.found.filter(x=>all.some(c=>c.discover===x)):[]}}}catch(e){}
let run=null;const app=document.getElementById('app'),$=id=>document.getElementById(id);
function count(list){return list.filter(c=>meta.mastered.includes(c.id)).length}
function dailyCount(){return count(groups.flatMap(g=>g.cases))}
function randomOpen(){return count(groups[0].cases)>=2&&count(groups[1].cases)>=2}
function travelOpen(){return dailyCount()>=10&&groups.every(g=>count(g.cases)>=2)&&count(events)>=2}
function feastOpen(){return travelOpen()&&count(extras[0].cases)>=2}
function allowed(key){if(key==='event')return randomOpen();if(key==='travel')return travelOpen();if(key==='feast')return feastOpen();let i=Number(key);return Number.isInteger(i)&&i>=0&&i<groups.length&&groups.slice(0,i).every(g=>count(g.cases)>=2)}
function save(){try{localStorage.setItem('food-game-campaign-v2',JSON.stringify(meta))}catch(e){}$('xp').textContent='✦ '+meta.xp}
function meter(n,total){return '<div class="bar" aria-label="'+n+' / '+total+'">'+Array.from({length:total},(_,i)=>'<i class="'+(i<n?'on':'')+'"></i>').join('')+'</div>'}
function home(){run=null;save();app.innerHTML='<div class="hero" style="padding-bottom:12px"><small>家庭饮食助手 · 生活日历</small><h1>日常生活</h1><div class="row"><b>WEEK 01 · '+dailyCount()+'/12 项长期目标</b><small>随机事件 '+count(events)+'/6</small></div>'+meter(dailyCount(),12)+'</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(210px,1fr))">'+groups.map((g,i)=>'<button class="tile" '+(allowed(String(i))?'onclick="start(\''+i+'\')"':'disabled')+'><small>0'+(i+1)+' · '+(allowed(String(i))?'目标 '+count(g.cases)+'/3':'完成前一阶段 2 项解锁')+'</small><div><h2>'+g.title+'</h2>'+g.mission+'</div>'+meter(count(g.cases),3)+'</button>').join('')+'</div><div class="divider"></div><div class="row"><h2>日常随机事件</h2><small>'+ (randomOpen()?'已解锁 · 每次抽取3件':'前两阶段各完成2项开放')+'</small></div><button class="tile" style="width:100%;min-height:110px" '+(randomOpen()?'onclick="start(\'event\')"':'disabled')+'><b>今天家里又有什么事？</b><small>突发生活情境 · 已掌握 '+count(events)+'/6　已遇见 '+events.filter(c=>meta.seen.includes(c.id)).length+'/6</small></button><div class="divider"></div><h2>特殊篇章</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(210px,1fr))">'+['travel','feast'].map((key,i)=>'<button class="tile" '+(allowed(key)?'onclick="start(\''+key+'\')"':'disabled')+'><small>WEEK 0'+(i+2)+' · '+(allowed(key)?'已解锁':'待解锁')+'</small><h2>'+extras[i].title+'</h2><small>'+(allowed(key)?'目标 '+count(extras[i].cases)+'/3':i===0?'日常10/12 · 各阶段至少2项 · 随机2项':'旅行周完成2项')+'</small></button>').join('')+'</div><div class="actions"><button onclick="shop()">助手升级</button><button onclick="album()">观察图鉴 · '+meta.found.length+'/'+all.length+'</button></div>'}
function draw(){let shuffled=[...events].map(c=>({c,r:Math.random()})).sort((a,b)=>Number(meta.mastered.includes(a.c.id))-Number(meta.mastered.includes(b.c.id))||Number(meta.seen.includes(a.c.id))-Number(meta.seen.includes(b.c.id))||a.r-b.r).map(x=>x.c);return shuffled.slice(0,3)}
function start(key){if(!allowed(key))return;let g=key==='event'?{title:'随机事件',mission:'应对今天的意外',desc:'三件突发生活事件。',cases:draw()}:key==='travel'?extras[0]:key==='feast'?extras[1]:groups[Number(key)];run={key,g,cases:g.cases,i:0,left:4+(meta.up.includes('speech')?2:0),phase:0,done:[],log:[],branch:0};app.innerHTML='<div class="end"><small>'+(key==='travel'||key==='feast'?g.title:'WEEK 01 · '+g.title)+'</small><h1>'+g.mission+'</h1><p>'+g.desc+'</p>'+run.cases.map((c,j)=>'<div class="check"><span class="mark">'+(meta.mastered.includes(c.id)?'✓':'0'+(j+1))+'</span>'+c.goal+'</div>').join('')+'<div class="receipt">本局发言 '+run.left+' 次 · 成功项目计入长期目标</div><div class="actions"><button onclick="home()">返回日历</button><button class="primary" onclick="begin()">接受委托</button></div></div>'}
function begin(){const c=run.cases[run.i];run.phase=0;run.log=[];if(run.i){let prev=run.done[run.i-1],pc=run.cases[run.i-1],line=pc.carry[prev.ok?0:1].split('：');run.log.push([line[0].replace('老',''),line.slice(1).join('：')])}run.log.push(...c.opening);play()}
function msg(m){return '<div class="msg '+(m[0]==='助手'?'me':'')+'"><div class="avatar">'+({妈:'妈',爸:'爸',女:'女',女儿:'女',助手:'助'}[m[0]]||m[0].slice(-1))+'</div><div><div class="name">'+({妈:'老妈',爸:'老爸',女:'女儿'}[m[0]]||m[0])+'</div><div class="bubble">'+m[1]+'</div></div></div>'}
function play(){let c=run.cases[run.i],b=c.branches[run.branch],limit=4+(meta.up.includes('speech')?2:0);let buttons='';if(run.phase===0){buttons=c.branches.map((v,j)=>'<button '+(v.say&&run.left===0?'disabled':'')+' onclick="first('+j+')">'+(v.say||'继续看他们聊')+'</button>').join('')}else if(run.phase===1||run.phase===3){let say=b.fix;buttons='<button '+(!run.left?'disabled':'')+' onclick="second(1)">'+say+'</button>';if(meta.up.includes('style')&&run.left)buttons+='<button onclick="second(1,true)">换个情境想一想：'+say+'</button>';buttons+='<button onclick="second(0)">先观察，留一次发言</button>'}else buttons='<button class="primary" onclick="advance()"> '+(run.i===2?'进入周末离线日':'查看这次的后续变化')+' →</button>';
app.innerHTML='<div class="layout"><aside class="side"><small>'+run.g.title+' · '+(run.i+1)+'/3</small><h2>'+run.g.mission+'</h2><p class="muted">本局目标 · 长期累计</p>'+run.cases.map((x,i)=>'<div class="check"><span class="mark">'+(i<run.done.length?(run.done[i].ok?'✓':'△'):i===run.i?'●':'○')+'</span>'+x.goal+'</div>').join('')+'<p>本周剩余发言　<b>'+run.left+'</b></p><div class="bar">'+Array.from({length:limit},(_,i)=>'<i class="'+(i<run.left?'on':'')+'"></i>').join('')+'</div><p class="muted">已观察 '+run.done.length+' / 3</p></aside><section><div class="row"><div><small>'+c.when+'</small><h2 style="margin:6px 0">相亲相爱一家人（4）</h2></div><span class="badge">'+c.food+'</span></div><div class="chat" id="chat">'+run.log.map(msg).join('')+'</div><div class="options"><small>'+(run.phase===2?'闲聊结束':'剩余 '+run.left+' 次 · 要不要插话？')+'</small>'+buttons+'</div></section></div>';let el=$('chat');el.scrollTop=el.scrollHeight}
function first(j){if(run.phase!==0)return;let c=run.cases[run.i],b=c.branches[j];if(b.say&&!run.left)return;run.branch=j;if(b.say){run.left--;run.log.push(['助手',b.say])}run.log.push(...b.reply);run.phase=1;play()}
function second(yes,style){if(run.phase!==1&&run.phase!==3)return;let c=run.cases[run.i],b=c.branches[run.branch];if(yes&&!run.left)return;if(!yes&&run.phase===1&&meta.up.includes('patience')&&run.left&&!b.pass){run.log.push(['爸','等一下，刚才这事我还想了一下。'],['女','爸今天居然主动续费聊天时间。']);run.phase=3;play();return}if(yes){run.left--;run.log.push(['助手',style?'换个情境想一想：'+b.fix:b.fix]);if(outcome(c,b,yes,run.branch))run.log.push(...b.good);else run.log.push([({老妈:'妈',老爸:'爸',女儿:'女'})[c.person],c.partial||'我还需要了解更多具体情况。'])}else run.log.push(...b.bad);run.done.push({ok:outcome(c,b,yes,run.branch),branch:run.branch,yes:!!yes});run.phase=2;play()}
function advance(){if(run.phase!==2)return;let c=run.cases[run.i],d=run.done[run.i],o=d.ok?c.win:c.lose;app.innerHTML='<div class="end"><small>'+c.when+' · 后续观察</small><h1>'+o[0]+'</h1><div class="receipt"><small>'+c.person+' · 分享了新餐食</small><div class="food">'+o[0]+'</div><p>“'+o[1]+'”</p></div><div class="check"><span class="mark">'+(d.ok?'✓':'○')+'</span>'+c.goal+'<span class="muted">'+(d.ok?'出现积极迹象':'仍有待观察')+'</span></div><p class="muted">周末确认他们能否独立应用这一判断。</p><div class="actions"><button class="primary" onclick="nextScene()">'+(run.i===2?'周末离线验收':'下一段生活')+' →</button></div></div>'}
function nextScene(){if(run.i<2){run.i++;begin()}else offline()}

function offline(){app.innerHTML='<div class="end"><small>周末 · 助手离线</small><h1>今天，由他们自己决定。</h1><p class="muted">新的生活情境 · 独立运用</p>'+run.cases.map((c,i)=>{let d=run.done[i],t=c.transfer,o=d.ok?t.win:t.lose;return '<div class="receipt"><div class="row"><small>'+c.person+' · '+t.scene+'</small><span class="badge">'+(d.ok?'达成':'待改善')+'</span></div><div class="food">'+o[0]+'</div><p>“'+o[1]+'”</p><small>'+c.goal+'</small></div>'}).join('')+'<div class="actions"><button class="primary" onclick="settle()">查看委托结果</button></div></div>'}
function settle(){if(!run||run.settled)return;run.settled=true;let before=[...groups.map((g,i)=>allowed(String(i))),randomOpen(),travelOpen(),feastOpen()],score=run.done.filter(d=>d.ok).length,newFound=[],newGoals=[];run.done.forEach((d,i)=>{let c=run.cases[i];if(!meta.seen.includes(c.id))meta.seen.push(c.id);if(d.ok&&!meta.mastered.includes(c.id)){meta.mastered.push(c.id);newGoals.push(c.goal)}if(!d.ok&&!meta.found.includes(c.discover)){meta.found.push(c.discover);newFound.push(c.discover)}});let after=[...groups.map((g,i)=>allowed(String(i))),randomOpen(),travelOpen(),feastOpen()],unlocked=[...groups.map(g=>g.title),'随机事件','旅游周','假期饭局周'].filter((x,i)=>after[i]&&!before[i]);let reward=newGoals.length*2+newFound.length+unlocked.length;meta.xp+=reward;meta.best[run.key]=Math.max(meta.best[run.key]||0,score);save();app.innerHTML='<div class="end"><small>'+run.g.title+' · 委托验收</small><h1>'+ (score===3?'圆满完成':score>=2?'委托完成':'还有些话没说清')+'　'+score+'/3</h1><div class="row"><b>✦ +'+reward+' 经验</b><span class="badge">新增目标 '+newGoals.length+'</span></div>'+run.cases.map((c,i)=>'<div class="check"><span class="mark">'+(run.done[i].ok?'✓':'○')+'</span>'+c.goal+'<small>'+(run.done[i].ok?(newGoals.includes(c.goal)?'新掌握':'再次达成'):'待挑战')+'</small></div>').join('')+(newFound.length?'<div class="receipt">新发现 · '+newFound.join(' / ')+'</div>':'')+(unlocked.length?'<div class="receipt"><b>解锁 '+unlocked.join(' / ')+'</b><p>返回日历查看新内容。</p></div>':'')+'<div class="receipt"><b>日常长期目标 '+dailyCount()+'/12</b>'+meter(dailyCount(),12)+'<p class="muted">旅行周：日常10项、各阶段至少2项、随机事件2项。</p></div><div class="actions"><button onclick="start(\''+run.key+'\')">'+(run.key==='event'?'抽取新事件':'重玩本委托')+'</button><button onclick="shop()">升级助手</button><button class="primary" onclick="home()">返回日历</button></div></div>'}
const upgrades=[['speech','发言扩容','每周额外获得 2 次发言',3],['style','表达优化','追加对比例子话术',3],['patience','家庭默契','部分闲聊多一次介入机会',3]];
function shop(){app.innerHTML='<div class="end"><small>局外成长</small><h1>助手升级</h1><div class="shop">'+upgrades.map((u,i)=>'<div class="receipt row"><div><b>'+u[1]+'</b><p>'+u[2]+'</p></div><button '+(meta.up.includes(u[0])||meta.xp<u[3]?'disabled':'onclick="buy('+i+')"')+'>'+(meta.up.includes(u[0])?'已拥有':'✦ '+u[3])+'</button></div>').join('')+'</div><div class="actions"><button class="primary" onclick="home()">返回生活日历</button></div></div>'}
function buy(i){let u=upgrades[i];if(meta.up.includes(u[0])||meta.xp<u[3])return;meta.xp-=u[3];meta.up.push(u[0]);save();shop()}

function album(){app.innerHTML='<div class="end"><small>认知图鉴 · '+meta.found.length+'/'+all.length+'</small><h1>人类饮食观察</h1><div class="grid">'+all.map(c=>'<div class="receipt">'+(meta.found.includes(c.discover)?'<b>'+c.discover+'</b><p>“'+c.lose[1]+'”</p>':'<b>？</b><p>尚未发现</p>')+'</div>').join('')+'</div><div class="actions"><button class="primary" onclick="home()">返回生活日历</button></div></div>'}
home();</script></body></html>
