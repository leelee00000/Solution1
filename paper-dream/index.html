<header><b>你以为吃得很健康？</b><span id="xp" class="badge">✦ 0</span></header><div id="app"></div></main><script>
const people=[{"name":"老妈","short":"妈","age":48,"history":"小时候跟外婆住，家里喝粥、炖汤。现在做财务，买菜讲究实惠，喜欢提前备好家人的饭。","taste":"热粥、炖汤、家常菜","belief":"吃得清淡就舒服；汤里的精华值得喝；家人吃一样比较省心。","base":{"v":0,"soup":-1,"light":-1,"fruit":0,"time":0,"portion":0,"source":0,"freq":0,"value":0}},{"name":"老爸","short":"爸","age":50,"history":"以前在工厂轮班，现在常在单位食堂吃饭。小时候家里买肉少，觉得一顿饭得吃得实在。","taste":"肉包、面条、红烧菜、浓汤","belief":"吃饱才有劲；汤底够味就很满足；特别的日子可以破例。","base":{"v":-1,"soup":0,"light":0,"fruit":-1,"time":0,"portion":-1,"source":0,"freq":-1,"value":0}},{"name":"女儿","short":"女","age":20,"history":"大学住校，早课赶时间，和室友点外卖。周末回家，爱研究好吃又方便的新东西。","taste":"面包、水果、奶茶、便利店简餐","belief":"水果最省事；看起来清爽就比较安心；很多饮食选择取决于时间。","base":{"v":0,"soup":0,"light":0,"fruit":-1,"time":-1,"portion":0,"source":0,"freq":-1,"value":0}}],groups=[{"title":"家常起步","mission":"把这一家人的三餐理顺","desc":"早餐、家常汤、校园午餐","cases":[{"id":"porridge","p":0,"slot":0,"axis":"light","title":"早上喝点热的","open":[[0,"早上起来胃里空空的，还是白粥舒服。我小时候外婆天天熬。",-1],[1,"我带两个包子走，粥到单位就饿了。",0],[2,"妈，冰箱还有昨晚你给我留的鸡蛋呢。",1]],"a":["热粥配个鸡蛋怎么样？",2],"b":["早上喝热粥挺舒服的。",-1],"good":[[0,"行，鸡蛋放碗里就好，省得另外洗盘子。",1],[1,"那也给我留一个，我下午带走。",0]],"bad":[[0,"我喝两碗就饱了，鸡蛋你们拿去吧。",-1],[2,"我感觉鸡蛋在我们家每天都被转让。",0]],"second":["以前喝粥还会配什么？",2],"habit":["白粥、馒头","s"],"better":["小米粥、鸡蛋、牛奶","spm"],"q0":"一大碗粥，热乎就踏实。","q1":"还是外婆那口粥，鸡蛋也没剩。","disc":"一碗粥包办早餐","secondWarm":["这个搭配挺合适。",1]},{"id":"broth","p":1,"slot":2,"axis":"soup","title":"爸爸的汤碗","open":[[1,"今天食堂那锅排骨汤不错，我打了一大碗。肉留给同事了。",-1],[0,"你那不是排骨汤吗，怎么只剩汤？",1],[2,"爸是负责喝汤的，排骨有自己的同事。",0]],"a":["汤和排骨一起吃也不错。",2],"b":["喝碗热汤确实舒服。",-1],"good":[[1,"行吧，肉吃两块，汤也照喝。",1],[0,"青菜也拿点，上次你说那个炒菜挺好吃。",1]],"bad":[[1,"主要是汤够味，吃肉还得吐骨头。",-1],[2,"你是来食堂追求无障碍用餐的。",0]],"second":["只喝汤，下午会饿吗？",2],"habit":["米饭、排骨汤（少量固形物）","s"],"better":["米饭、排骨、青菜、汤","spv"],"q0":"今天喝了两碗汤，舒服。","q1":"排骨这次没让给同事，配了青菜。","disc":"汤碗里的精华","secondWarm":["这样汤和肉都吃到了。",1]},{"id":"fruitlunch","p":2,"slot":1,"axis":"fruit","title":"图书馆楼下","open":[[2,"图书馆楼下切好的水果超方便，今天午饭就它了。",-1],[0,"你上午就吃了片面包吧？下午还有课吗？",1],[1,"我中午也吃水果，跟食堂的饭一起吃。",1]],"a":["水果配个饭团，下午更顶饿。",2],"b":["切好的水果确实方便 function applyD(st,e){for(const [k,v] of Object.entries(e))st.B[k]=(st.B[k]||0)+v}
function pickD(c){return c.sort((a,b)=>b[1]-a[1])[0][0]}
function mealsD(st){const b=st.B,v=st.seed,d=st.day;let ids;if(d===0)ids=[pickD([["ms",5+b.mom],["mt",3],["mb",2+b.mix]]),pickD([["dn",5+b.mix],["ds",4+b.dad+b.greens]]),pickD([["gb",5+(v===1?1:0)-b.girl],["ge",3+b.egg+b.girl*.3],["gt",v===0?1+b.egg*.5+b.tomato+b.girl*.3:-50],["gs",v===0?1+b.meal+b.girl*.5:-50]])];else if(d===1)ids=[pickD([["ms",4+b.mom],["mt",5-b.mom]]),pickD([["da",4+b.apple+b.mix*.7+(v===0?2:0)],["ds",4+b.greens+b.dad+(v===1?2:-1)],["pm",v===0?3+b.quick+b.dad*.4:1+b.quick*.4],["dm",3+b.apple+b.mix],["dn",4]]),pickD([["gs",5+b.meal+b.girl*.5],["gl",4+(v===1?1:0)],["ge",3+b.egg*.3]])];else{let egg=b.potEgg>=3,veg=b.potVeg>=(v===0?2:3),base=egg&&veg?"pf":egg?"pe":veg?"pv":"pp";ids=[base,pickD([[base,5+b.mom*.3],["ps",2+b.share+b.potEgg*.5],["pa",3+b.mix*.5+b.many*.5]]),pickD([[base,4+b.mom*.3],["ps",2+b.share+b.egg*.4],["pf",1+b.potVeg*.5+b.potEgg*.5+b.girl*.3]])];if(!egg||!veg){if(ids[2]==="pf")ids[2]=egg?"pe":veg?"pv":"pp"}}
return ids.map(id=>({id,name:F[id][0],tags:F[id][1],score:[..."spv"].filter(x=>F[id][1].includes(x)).length}))}
function resultD(st){let per=[0,1,2].map(p=>st.days.reduce((s,d)=>s+d[p].score,0));let total=per.reduce((a,b)=>a+b,0);return {per,total,pass:total>=23&&per.every(x=>x>=7)}}
function cloneD(x){return JSON.parse(JSON.stringify(x))}
function advanceD(st){if(st.phase===0){st.phase=1}else{st.days.push(mealsD(st));st.day++;st.phase=0}}

function dlike(i){if(!dr||!dr.likes||i<dr.from)return;let m=dr.logs[i];if(!m||m.p===3||m.liked)return;dr.likes--;dr.lastAdvice=null;m.liked=true;applyD(dr,m.e);dr.actions.push({day:dr.day,text:'点赞：'+m.t,kind:m.hint});dstep()}

function dsettle(){if(dr.settled)return;dr.settled=true;let z=resultD(dr),newFound=[];if(dr.reports[0].mix>=2&&dr.days[1][1].id!=='ds')newFound.push('顺手搭配 → 苹果代菜');if(dr.reports[2].many>=2)newFound.push('食物多样 → 数调味料');if(dr.days[0][2].id==='ge'&&dr.seed===1)newFound.push('时间限制 → 合理建议也只能部分落实');let gained=newFound.filter(x=>!dm.found.includes(x));dm.found.push(...gained);let reward=Math.max(0,z.total-dm.best)+gained.length+(z.pass&&!dm.passed?3:0);dm.best=Math.max(dm.best,z.total);dm.passed=dm.passed||z.pass;dm.xp+=reward;dm.attempt++;dsave();app.innerHTML='<div class="end" style="max-width:850px"><small>委托结算 · 午餐搭配</small><h1>'+(z.pass?'委托达成':'仍有改善空间')+'</h1><div class="receipt"><div class="big-number">'+z.total+'/27</div><small>目标 23 · 每人至少 7</small></div>'+z.per.map((v,i)=>'<div class="check"><b>'+dnames[i]+'</b><span>'+v+'/9 '+(v>=7?'✓':'△')+'</span></div>').join('')+'<h2 style="margin-top:24px">真实餐食</h2>'+dr.days.map((d,i)=>'<p><b>DAY 0'+(i+1)+'</b> · '+dtitles[i]+'</p><div class="data-grid">'+d.map(dmeal).join('')+'</div>').join('')+(newFound.length?'<div class="receipt"><b>认知回响</b>'+newFound.map(x=>'<p>'+x+'</p>').join('')+'</div>':'')+'<details><summary>查看介入记录</summary>'+dr.actions.map(a=>'<p>DAY '+(a.day+1)+' · '+a.text+'<br><small>'+a.kind+'</small></p>').join('')+'</details><p>✦ +'+reward+' 经验 · 历史最佳 '+dm.best+'/27</p><p class="muted">模拟结果；类别出现不代表实际营养达标。每次重玩有不同的时间与食材条件。</p><div class="actions"><button onclick="dstart()">再试一次</button><button onclick="dshop()">权限与能力</button><button class="primary" onclick="dhome()">返回日历</button></div></div>'}
