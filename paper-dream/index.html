<header><b>你以为吃得很健康？</b><span id="xp" class="badge">✦ 0</span></header><div id="app"></div></main><script>
const people=[{"name":"老妈","short":"妈","age":48,"history":"小时候跟外婆住，家里喝粥、炖汤。现在做财务，买菜讲究实惠，喜欢提前备好家人的饭。","taste":"热粥、炖汤、家常菜","belief":"吃得清淡就舒服；汤里的精华值得喝；家人吃一样比较省心。","base":{"v":0,"soup":-1,"light":-1,"fruit":0,"time":0,"portion":0,"source":0,"freq":0,"value":0}},{"name":"老爸","short":"爸","age":50,"history":"以前在工厂轮班，现在常在单位食堂吃饭。小时候家里买肉少，觉得一顿饭得吃得实在。","taste":"肉包、面条、红烧菜、浓汤","belief":"吃饱才有劲；汤底够味就很满足；特别的日子可以破例。","base":{"v":-1,"soup":0,"light":0,"fruit":-1,"time":0,"portion":-1,"source":0,"freq":-1,"value":0}},{"name":"女儿","short":"女","age":20,"history":"大学住校，早课赶时间，和室友点外卖。周末回家，爱研究好吃又方便的新东西。","taste":"面包、水果、奶茶、便利店简餐","belief":"水果最省事；看起来清爽就比较安心；很多饮食选择取决于时间。","base":{"v":0,"soup":0,"light":0,"fruit":-1,"time":-1,"portion":0,"source":0,"freq":-1,"value":0}}],groups=[{"title":"家常起步","mission":"把这一家人的三餐理顺","desc":"早餐、家常汤、校园午餐","cases":[{"id":"porridge","p":0,"slot":0,"axis":"light","title":"早上喝点热的","open":[[0,"早上起来胃里空空的，还是白粥舒服。我小时候外婆天天熬。",-1],[1,"我带两个包子走，粥到单位就饿了。",0],[2,"妈，冰箱还有昨晚你给我留的鸡蛋呢。",1]],"a":["热粥配个鸡蛋怎么样？",2],"b":["早上喝热粥挺舒服的。",-1],"good":[[0,"行，鸡蛋放碗里就好，省得另外洗盘子。",1],[1,"那也给我留一个，我下午带走。",0]],"bad":[[0,"我喝两碗就饱了，鸡蛋你们拿去吧。",-1],[2,"我感觉鸡蛋在我们家每天都被转让。",0]],"second":["以前喝粥还会配什么？",2],"habit":["白粥、馒头","s"],"better":["小米粥、鸡蛋、牛奶","spm"],"q0":"一大碗粥，热乎就踏实。","q1":"还是外婆那口粥，鸡蛋也没剩。","disc":"一碗粥包办早餐","secondWarm":["这个搭配挺合适。",1]},{"id":"broth","p":1,"slot":2,"axis":"soup","title":"爸爸的汤碗","open":[[1,"今天食堂那锅排骨汤不错，我打了一大碗。肉留给同事了。",-1],[0,"你那不是排骨汤吗，怎么只剩汤？",1],[2,"爸是负责喝汤的，排骨有自己的同事。",0]],"a":["汤和排骨一起吃也不错。",2],"b":["喝碗热汤确实舒服。",-1],"good":[[1,"行吧，肉吃两块，汤也照喝。",1],[0,"青菜也拿点，上次你说那个炒菜挺好吃。",1]],"bad":[[1,"主要是汤够味，吃肉还得吐骨头。",-1],[2,"你是来食堂追求无障碍用餐的。",0]],"second":["只喝汤，下午会饿吗？",2],"habit":["米饭、排骨汤（少量固形物）","s"],"better":["米饭、排骨、青菜、汤","spv"],"q0":"今天喝了两碗汤，舒服。","q1":"排骨这次没让给同事，配了青菜。","disc":"汤碗里的精华","secondWarm":["这样汤和肉都吃到了。",1]},{"id":"fruitlunch","p":2,"slot":1,"axis":"fruit","title":"图书馆楼下","open":[[2,"图书馆楼下切好的水果超方便，今天午饭就它了。",-1],[0,"你上午就吃了片面包吧？下午还有课吗？",1],[1,"我中午也吃水果，跟食堂的饭一起吃。",1]],"a":["水果配个饭团，下午更顶饿。",2],"b":["切好的水果确实方便 function allowed(k){if(k==='event')return eventOpen();if(k==='travel')return travelOpen();if(k==='feast')return travelOpen()&&meta.cleared.includes('travel');return Number(k)===0||meta.cleared.includes(String(Number(k)-1))}
function meter(n,total){return '<div class="bar" style="max-width:100%;overflow:hidden">'+Array.from({length:Math.min(total,20)},(_,i)=>'<i style="flex:1;min-width:0" class="'+(i<Math.round(n/total*Math.min(total,20))?'on':'')+'"></i>').join('')+'</div>'}
function home(){run=null;save();app.innerHTML='<div class="hero" style="padding-bottom:14px"><small>家庭健康管家 · 生活日历</small><h1>日常生活</h1><div class="row"><b>WEEK 01 · '+daily()+'/12</b><small>随机事件 '+count(events)+'/6</small></div>'+meter(daily(),12)+'</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(210px,1fr))">'+groups.map((g,i)=>'<button class="tile" '+(allowed(String(i))?'onclick="start(\''+i+'\')"':'disabled')+'><small>0'+(i+1)+' · '+(meta.cleared.includes(String(i))?'已通过':allowed(String(i))?'可挑战':'上一阶段通过后开放')+'</small><h2>'+g.title+'</h2><small>'+g.desc+' · '+count(g.cases)+'/3</small></button>').join('')+'</div><div class="divider"></div><button class="tile" style="width:100%;min-height:100px" '+(eventOpen()?'onclick="start(\'event\')"':'disabled')+'><b>随机事件</b><small>'+(eventOpen()?'抽取三个生活意外 · '+count(events)+'/6':'前两阶段通过并累计4项目标')+'</small></button><div class="divider"></div><h2>特殊篇章</h2><div class="grid">'+['travel','feast'].map((k,i)=>'<button class="tile" '+(allowed(k)?'onclick="start(\''+k+'\')"':'disabled')+'><small>WEEK 0'+(i+2)+'</small><h2>'+extras[i].title+'</h2><small>'+(allowed(k)?'可挑战':i===0?'日常四阶段通过 · 10项目标 · 随机2项':'旅行周通过后开放')+'</small></button>').join('')+'</div><div class="actions"><button onclick="profiles()">家庭成员</button><button onclick="shop()">助手升级</button><button onclick="album()">观察图鉴 '+meta.found.length+'/'+all.length+'</button></div>'}
function profiles(){app.innerHTML='<div class="end"><small>家庭档案</small><h1>相亲相爱一家人</h1>'+people.map(p=>'<div class="person"><h2>'+p.name+' · '+p.age+'岁</h2><p>'+p.history+'</p><p><b>喜欢</b>　'+p.taste+'</p><p><b>相信</b>　'+p.belief+'</p></div>').join('')+'<div class="actions"><button class="primary" onclick="home()">返回日历</button></div></div>'}
function draw(){return people.map((p,i)=>events.filter(c=>c.p===i).map(c=>({c,r:Math.random()})).sort((a,b)=>Number(meta.mastered.includes(a.c.id))-Number(meta.mastered.includes(b.c.id))||Number(meta.seen.includes(a.c.id))-Number(meta.seen.includes(b.c.id))||a.r-b.r)[0].c)}
function start(k){if(!allowed(k))return;let g=k==='event'?{title:'随机事件',mission:'应对今天的意外',desc:'三件临时生活事件',cases:draw()}:k==='travel'?extras[0]:k==='feast'?extras[1]:groups[Number(k)];run={k,g,B:initBeliefs(),day:0,phase:0,words:4+(meta.up.includes('speech')?2:0),likes:3+(meta.up.includes('patience')?2:0),days:[],log:[],out:[],from:0};let t=target(k);app.innerHTML='<div class="end"><small>'+g.title+' · 本轮委托</small><h1>'+g.mission+'</h1><p>四个采样日，后台记录三人的早餐、午餐、晚餐。</p><div class="receipt"><small>通关条件 · 食物类别覆盖</small><div class="big-number">'+t.total+'/60</div><p>全家累计类别覆盖；每人至少 '+t.each+'/20。</p><small>五类食物 × 四天 × 三人。模拟指标，仅衡量类别覆盖。</small></div><div class="row"><span>发言 '+run.words+' 次</span><span>静默点赞 '+run.likes+' 次</span></div><div class="actions"><button onclick="home()">返回</button><button class="primary" onclick="begin()">进入家庭群</button></div></div>'}
function begin(){let c=run.g.cases[run.day];run.phase=0;run.log=[];run.from=0;if(run.day){let old=run.g.cases[run.day-1],o=run.out[run.day-1];run.log.push({p:old.p,text:'昨天'+(o?old.q1:old.q0),d:0})}run.from=run.log.length;run.log.push(...c.open.map(([p,text,d])=>({p,text,d})));play()}
function add(lines){run.log.push(...lines.map(([p,text,d])=>({p,text,d})))}
function renderMsg(m,i){let me=m.p===3,liked=m.liked;return '<div class="msg '+(me?'me':'')+'"><div class="avatar">'+(me?'助':people[m.p].short)+'</div><div><div class="name">'+(me?'助手':people[m.p].name)+'</div><div class="bubble">'+m.text+'</div>'+(!me&&(liked||i>=run.from&&run.phase<2)?'<button class="like '+(liked?'chosen':'')+'" '+(liked||!run.likes||run.phase===2?'disabled':'onclick="actLike('+i+')"')+' aria-label="为这条消息点赞">'+(liked?'♥ 已点赞':'♡')+'</button>':'')+'</div></div>'}
function play(){let c=run.g.cases[run.day],t=target(run.k),s=stats(run.days);let opts=run.phase===0?[c.a,c.b]:[choose(run.B,c)?c.secondWarm:c.second];if(run.phase===1&&meta.up.includes('style'))opts.push([styleLines[c.id][0],1]);let buttons=run.phase<2?opts.map((o,i)=>'<button '+(!run.words?'disabled':'')+' onclick="actSay('+i+')">'+o[0]+'</button>').join('')+'<button onclick="observe()">继续看他们聊</button>':'<button class="primary" onclick="feedback()">查看接下来的三餐 →</button>';
app.innerHTML='<div class="layout"><aside class="side"><small>'+run.g.title+' · 第 '+(run.day+1)+' 天</small><h2>'+run.g.mission+'</h2><p>累计覆盖 <b>'+s.total+'/'+t.total+'</b></p>'+people.map((p,i)=>'<div class="check">'+p.name+'　'+s.nums[i]+'/'+t.each+'</div>').join('')+'<div class="divider"></div><p>发言 <b>'+run.words+'</b>　点赞 <b>'+run.likes+'</b></p><small>点击消息旁的 ♡ 静默回应</small></aside><section><div class="row"><div><small>'+['周一','周三','周五'][run.day]+' · '+c.title+'</small><h2 style="margin:6px 0">相亲相爱一家人（4）</h2></div><span class="badge">发言 '+run.words+' · ♡ '+run.likes+'</span></div><div class="chat" id="chat">'+run.log.map(renderMsg).join('')+'</div><div class="options">'+buttons+'</div></section></div>';let el=$('chat');el.scrollTop=run.phase===0?0:el.scrollHeight}
function actLike(i){if(run.phase>=2||!run.likes||i<run.from)return;let c=run.g.cases[run.day],m=run.log[i];if(!m||m.p===3||m.liked)return;m.liked=true;run.likes--;apply(run.B,c,{type:'like',line:[m.p,m.text,m.d]});step()}
function actSay(i){if(run.phase>=2||!run.words)return;let c=run.g.cases[run.day],o=run.phase===0?[c.a,c.b][i]:i===0?(choose(run.B,c)?c.secondWarm:c.second):[styleLines[c.id][0],1];if(!o)return;run.words--;run.log.push({p:3,text:o[0],d:0});apply(run.B,c,{type:'say',d:o[1]});if(run.phase===1&&i===1)shift(run.B,styleLines[c.id][1],c.axis,1);step()}
function observe(){if(run.phase<2)step()}
function step(){let c=run.g.cases[run.day];run.from=run.log.length;if(run.phase===0){add(choose(run.B,c)?c.good:c.bad);run.phase=1}else{let ok=choose(run.B,c);run.log.push({p:c.p,text:ok?c.q1:c.q0,d:0});run.out.push(ok);run.days.push(dayRecord(run.B,run.day,[c]));run.phase=2}play()}
function rowData(d,i){return '<div class="receipt"><div class="row"><b>'+people[i].name+'</b><small>'+d.groups+'/5类</small></div>'+d.meals.map((m,j)=>'<div class="small-meal"><small>'+['早','午','晚'][j]+'</small>　'+m[0]+'</div>').join('')+'<div class="divider" style="margin:9px 0"></div><small>'+[...new Set(d.meals.flatMap(m=>[...m[1]]))].map(k=>names[keys.indexOf(k)]).join(' · ')+'</small></div>'}
function feedback(){if(run.phase!==2)return;let c=run.g.cases[run.day],d=run.days[run.day];app.innerHTML='<div class="end" style="max-width:920px"><small>后台餐食记录 · 第 '+(run.day+1)+' 天</small><h1>'+people[c.p].name+'：'+(run.out[run.day]?c.q1:c.q0)+'</h1><div class="data-grid">'+d.map(rowData).join('')+'</div><p class="muted">本日合计 '+d.reduce((s,p)=>s+p.groups,0)+'/15 类别覆盖</p><div class="actions"><button class="primary" onclick="next()"> '+(run.day===2?'周末离线':'下一段闲聊')+' →</button></div></div>'}
function next(){if(run.day<2){run.day++;begin()}else offline()}
function offline(){if(run.days.length!==3)return;run.days.push(dayRecord(run.B,3,run.g.cases,true));let d=run.days[3];app.innerHTML='<div class="end" style="max-width:920px"><small>周末 · 助手离线</small><h1>今天，他们自己安排。</h1><div class="data-grid">'+d.map(rowData).join('')+'</div><p class="muted">独立选择计入最后一个采样日。</p><div class="actions"><button class="primary" onclick="settle()">查看家庭饮食报告</button></div></div>'}
function settle(){if(!run||run.settled)return;run.settled=true;let s=stats(run.days),t=target(run.k),ok=passed(run.days,run.k),newGoals=[],newFound=[],first=ok&&!meta.cleared.includes(run.k);run.g.cases.forEach((c,i)=>{if(!meta.seen.includes(c.id))meta.seen.push(c.id);if(run.out[i]&&run.days[i][c.p].meals[c.slot][0]===c.better[0]&&run.days[3][c.p].meals[c.slot][0]===alternate(c,true)[0]&&!meta.mastered.includes(c.id)){meta.mastered.push(c.id);newGoals.push(c.title)}if(!run.out[i]&&!meta.found.includes(c.disc)){meta.found.push(c.disc);newFound.push(c.disc)}});if(first)meta.cleared.push(run.k);let reward=newGoals.length*2+newFound.length+(first?3:0);meta.xp+=reward;meta.best[run.k]=Math.max(meta.best[run.k]||0,s.total);save();app.innerHTML='<div class="end"><small>家庭饮食报告 · '+run.g.title+'</small><h1>'+(ok?'本轮通过':'继续调整')+'</h1><div class="receipt"><small>家庭类别覆盖</small><div class="big-number">'+s.total+'/60</div><p>目标 '+t.total+' · '+(s.total>=t.total?'达成':'尚差 '+(t.total-s.total))+'</p>'+meter(s.total,60)+'</div>'+people.map((p,i)=>'<div class="check"><b>'+p.name+'</b><span>'+s.nums[i]+'/20 · '+(s.nums[i]>=t.each?'✓ 达标':'差 '+(t.each-s.nums[i]))+'</span></div>').join('')+'<p>✦ +'+reward+' 经验　·　新增长期目标 '+newGoals.length+'</p>'+(newGoals.length?'<div class="receipt">新掌握 · '+newGoals.join(' / ')+'</div>':'')+(newFound.length?'<div class="receipt">观察发现 · '+newFound.join(' / ')+'</div>':'')+'<details><summary>四天餐食明细</summary>'+run.days.map((d,i)=>'<h3>第 '+(i+1)+' 天</h3>'+d.map(rowData).join('')).join('')+'</details><p class="muted">游戏内类别覆盖率，未计算克数、营养素或个人医学需求。</p><div class="actions"><button onclick="start(\''+run.k+'\')">重新挑战</button><button onclick="shop()">升级</button><button class="primary" onclick="home()">返回日历</button></div></div>'}
const upgrades=[['speech','发言扩容','每轮多2次发言',4],['patience','家庭默契','每轮多2次点赞',4],['style','话术储备','第二轮多一个回应选项',4]];
function shop(){app.innerHTML='<div class="end"><h1>助手升级</h1>'+upgrades.map((u,i)=>'<div class="receipt row"><div><b>'+u[1]+'</b><p>'+u[2]+'</p></div><button '+(meta.up.includes(u[0])||meta.xp<u[3]?'disabled':'onclick="buy('+i+')"')+'>'+(meta.up.includes(u[0])?'已拥有':'✦ '+u[3])+'</button></div>').join('')+'<div class="actions"><button class="primary" onclick="home()">返回日历</button></div></div>'}
function buy(i){let u=upgrades[i];if(meta.up.includes(u[0])||meta.xp<u[3])return;meta.xp-=u[3];meta.up.push(u[0]);save();shop()}
function album(){app.innerHTML='<div class="end"><h1>人类饮食观察</h1><div class="grid">'+all.map(c=>'<div class="receipt">'+(meta.found.includes(c.disc)?'<b>'+c.disc+'</b><p>'+c.q0+'</p>':'<b>？</b><p>尚未发现</p>')+'</div>').join('')+'</div><div class="actions"><button class="primary" onclick="home()">返回日历</button></div></div>'}
home();</script></body></html>
