<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>千纸梦 · 翻花机制白模</title><style>:root{font-family:Inter,'Segoe UI','Microsoft YaHei',sans-serif;color:#262a2b;background:#e9e9e6;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button{font:inherit;color:inherit;cursor:pointer;border:1px solid #c7c8c4;background:#f8f8f5;border-radius:4px;padding:8px 12px;font-size:11px}button:hover{background:#e8e9e4}button:focus-visible,input:focus-visible{outline:2px solid #51968e;outline-offset:3px}main{max-width:1600px;margin:auto;background:#f4f4ef;min-height:100vh;display:flex;flex-direction:column}header{display:flex;height:66px;align-items:center;justify-content:space-between;gap:15px;padding:0 28px;border-bottom:1px solid #d1d3cc}strong{font-size:18px;font-weight:550;white-space:nowrap}strong span{font-size:9px;font-weight:400;letter-spacing:1px;color:#8c918c;margin-left:12px}nav{display:flex;gap:7px}nav button{border-color:transparent;background:transparent;color:#8a8e88;padding:10px 14px}nav button.active{color:#222;background:#e6e8e0}.tools{display:flex;gap:6px}.tools button{background:transparent;border-color:transparent;color:#7a8179}#stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}canvas{display:block;aspect-ratio:16/9;width:100%;max-height:calc(100vh - 112px);object-fit:contain;touch-action:none;outline:none}#task{position:absolute;top:29px;left:34px;pointer-events:none}#chapter{font-size:9px;letter-spacing:2px;color:#8b928b}h1{font-size:23px;font-weight:500;letter-spacing:2px;margin:10px 0}#goal{font-size:11px;color:#898f85;max-width:340px;line-height:1.8}#mode{position:absolute;right:26px;top:27px;display:flex;align-items:center;gap:10px;font-size:11px;color:#737a71}#mode i{width:6px;height:6px;background:#728f83;border-radius:50%}#mode button{font-size:10px}#edit{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);border:1px solid #c6cac0;background:#fafbf6f5;border-radius:6px;padding:13px 18px;box-shadow:0 8px 30px #00000008;min-width:400px}.edit-title{display:flex;justify-content:space-between;align-items:center;gap:35px;font-size:11px}.edit-title small{font-size:9px;color:#91988d}#foldControls,#parts,#slingControls{display:flex;gap:10px;align-items:center;margin-top:12px}input[type=range]{accent-color:#6e8277;width:200px}output{font:11px monospace;min-width:32px;color:#838b7c}#editNote{display:block;color:#969e90;font-size:9px;margin-top:10px}#parts button.selected{background:#39483f;color:white;border-color:#39483f}#slingControls span{font-size:10px;color:#8a9286}#sling{background:#39483f;color:#fff;border:0;min-width:100px}#toast{position:absolute;left:50%;top:105px;transform:translateX(-50%);background:#39483fec;color:#f7f9ee;font-size:11px;padding:10px 17px;border-radius:4px;pointer-events:none;opacity:0;transition:opacity .2s;max-width:70%;text-align:center}#toast.show{opacity:1}footer{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-top:1px solid #d5d8ce;font-size:10px;color:#8b9286;gap:20px}footer>div{display:flex;align-items:center;gap:6px;white-space:nowrap}kbd{font:9px inherit;padding:3px 5px;border:1px solid #d2d6ca;border-radius:3px;color:#697264;margin-left:7px}#counter{white-space:nowrap;color:#647f70;font-size:12px}#win{position:absolute;inset:0;background:#eef0e79c;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center}#win>div{width:460px;max-width:90%;padding:32px;border:1px solid #ccd1c2;background:#f8f9f2;border-radius:6px;text-align:center}#win span{font-size:10px;color:#7e8f78;letter-spacing:3px}h2{font-size:21px;font-weight:450;margin:22px 0;line-height:1.7}#win p{font-size:11px;color:#8a9582;line-height:1.8}#next{background:#39483f;color:#fff;border-color:#39483f;margin:15px 6px 0}#again{background:transparent;border:0}#legend{position:absolute;right:24px;bottom:25px;background:#f8faf0e8;border:1px solid #d2d8c9;padding:14px;display:grid;gap:9px;font-size:9px;color:#8a9580}#legend b{font-weight:500;color:#52664f}[hidden]{display:none!important}@media(min-aspect-ratio:18/10){#task{top:18px}h1{font-size:19px;margin:8px 0}#goal{margin-top:5px}}@media(max-width:850px){header{padding:0 12px;height:55px}strong span{display:none}strong{font-size:15px}nav button{padding:7px;font-size:9px}.tools button{font-size:9px;padding:6px}.tools #fullscreen{display:none}footer{padding:0 10px;font-size:8px}#context{display:none}#task{top:16px;left:20px}h1{font-size:18px}#goal{font-size:9px;max-width:260px}#mode{top:17px;right:15px}#edit{transform:translateX(-50%) scale(.85);transform-origin:bottom center;bottom:10px}#legend{font-size:8px;padding:9px;right:12px;bottom:10px}canvas{max-height:calc(100vh - 101px)}}
</style></head><body><main><header><strong>千纸梦 <span>机制白模 / 02</span></strong><nav aria-label="关卡"><button data-level="0" class="active">01 翻 · 铰接成路</button><button data-level="1">02 换 · 卡片转向</button><button data-level="2">03 甩 · 借力起飞</button></nav><div class="tools"><button id="inspect" title="F3">结构透视</button><button id="reset" title="重新开始本关">↻ 重置</button><button id="fullscreen" title="全屏">⛶</button></div></header><section id="stage"><canvas id="game" width="1280" height="720" tabindex="0" aria-label="千纸梦可玩机制白模，A D 移动，空格跳跃，Tab 编辑"></canvas><div id="task"><span id="chapter">实验 01 / 翻</span><h1 id="name">铰接成路</h1><p id="goal">拉开活动纸板，纸层围绕固定连接边展开。</p></div><div id="mode"><i></i><span id="modeText">角色</span><button id="toggle">Tab 编辑</button></div><div id="edit" hidden><div class="edit-title"><span id="selectedLabel">铰接扇面</span><small>仅调整带圆形铰点的组件</small></div><div id="foldControls"><button id="fold">收拢</button><input id="aperture" type="range" min="5" max="180" value="5" aria-label="纸板开合角度"><button id="unfold">展开</button><output id="angle">5°</output></div><div id="parts" hidden><button data-part="bud">双球卡片</button><button data-part="fan">扇面卡片</button><button id="rotate">↶ 卡片旋转 90°</button></div><div id="slingControls" hidden><button id="sling">甩开 ↗</button><span>先站上活动纸板的外端</span></div><small id="editNote">拖动画面中的方形纸板端点，也可连续控制开合。</small></div><div id="toast" role="status"></div><div id="win" hidden><div><span>实验完成</span><h2 id="winTitle">同一叠纸，展开另一条路。</h2><p id="winText"></p><button id="next">下一实验 →</button><button id="again">再试一次</button></div></div><div id="legend" hidden><b>结构与物理</b><span>黑：固定纸板 / 方形：活动纸板端点</span><span>灰：连续纸层 / 圆形：固定铰接边</span><span>红线：实体碰撞 / 蓝框：角色</span></div></section><footer><div><kbd>A</kbd><kbd>D</kbd> 移动 <kbd>Space</kbd> 单段跳 <kbd>Tab</kbd> 编辑 <kbd id="special">R</kbd><span id="specialText">回存档</span></div><span id="context">纸板与纸层是同一组件；背景网格不参与碰撞。</span><span id="counter">◇ 0 / 1</span></footer></main><script>'use strict';
(()=>{
const $=id=>document.getElementById(id),cv=$('game'),c=cv.getContext('2d');
const DT=1/120,G=1600,H=50,W=24,V=180,JV=Math.sqrt(2*G*100),N=128,PI=Math.PI;
const titles=['铰接成路','卡片转向','借力起飞'],goals=['拉开活动纸板。固定连接边不动，纸层沿铰边依次展开。','空槽只能装一张卡片。换装扇面，再将整张卡片转向。','走上左侧活动纸板外端，按 F 甩开。站位决定弹射方向与力度。'];
let level=0,p,fan,parts=[],lands=[],coin,mode='play',debug=false,done=false,selected=false,drag=false,motion=null,sling=null,keys=new Set(),queued=false,time=0,fps=60,apex=0,jumpBase=null,toastTime=0,fx=[];
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');toastTime=4}
function polyGeom(id,poly,kind='land',extra={}){let x0=Math.min(...poly.map(v=>v.x)),x1=Math.max(...poly.map(v=>v.x)),a=[];for(let i=0;i<=N;i++){let x=lerp(x0,x1,i/N),hits=[];for(let j=0;j<poly.length;j++){let u=poly[j],v=poly[(j+1)%poly.length];if(Math.abs(u.x-v.x)<1e-8){if(Math.abs(x-u.x)<.0001)hits.push(u.y,v.y)}else if(x>=Math.min(u.x,v.x)-1e-8&&x<=Math.max(u.x,v.x)+1e-8){let t=clamp((x-u.x)/(v.x-u.x),0,1);hits.push(lerp(u.y,v.y,t))}}a.push({x,y:Math.min(...hits),b:Math.max(...hits)})}return{id,poly,a,kind,...extra}}
function rect(id,x0,x1,y,b=800,kind='land'){return polyGeom(id,[{x:x0,y},{x:x1,y},{x:x1,y:b},{x:x0,y:b}],kind)}
function circle(id,x,y,r,ry=r,rot=0){let poly=[];for(let i=0;i<96;i++){let t=i/96*2*PI,dx=r*Math.cos(t),dy=ry*Math.sin(t);poly.push({x:x+dx*Math.cos(rot)-dy*Math.sin(rot),y:y+dx*Math.sin(rot)+dy*Math.cos(rot)})}return polyGeom(id,poly,'bud',{cx:x,cy:y,r,ry,rot})}
function shell(f){let poly=[{x:f.x,y:f.y}];for(let i=0;i<=96;i++){let a=f.rot-PI+f.open*i/96;poly.push({x:f.x+f.r*Math.cos(a),y:f.y+f.r*Math.sin(a)})}return polyGeom('fan',poly,'fan',{...f})}
function rebuild(){parts=[];if(level===1&&!fan.part)return;if(level===1&&fan.part==='bud'){parts=[circle('bud0',650,570,65),circle('bud1',650,705,65),rect('spine',642,658,570,760,'board')];return}let rot=fan.rot,transform=(x,y)=>({x:fan.x+x*Math.cos(rot)-y*Math.sin(rot),y:fan.y+x*Math.sin(rot)+y*Math.cos(rot)});parts=[shell(fan),polyGeom('spine',[transform(-9,-8),transform(14,-8),transform(14,160),transform(-9,160)],'board')];for(let side of [-1,1]){let q=transform(side*43,92);parts.push(circle('attached'+side,q.x,q.y,34,42,rot+side*.2))}}
function all(){return lands.concat(parts)}
function at(g,x){if(x+W/2<=g.a[0].x+.01||x-W/2>=g.a[N].x-.01)return null;const pos=clamp((x-g.a[0].x)/(g.a[N].x-g.a[0].x)*N,0,N),i=Math.min(N-1,Math.floor(pos)),u=g.a[i],v=g.a[i+1];return {y:lerp(u.y,v.y,pos-i),b:lerp(u.b,v.b,pos-i),slope:(v.y-u.y)/(v.x-u.x)}}
function spawn(){p={x:125,y:(level===2?590:500)-H,vx:0,vy:0,ground:null,air:false,face:1};queued=false;keys.clear();apex=0;jumpBase=null}
function load(l){toastTime=0;$('toast').classList.remove('show');level=l;done=false;selected=false;mode='play';motion=null;sling=null;time=0;fx=[];fan={x:l===0?640:l===1?650:620,y:l===0?620:l===1?650:610,r:l===0?210:l===1?220:200,open:l===1?PI:.08,rot:l===1?PI/2:0,part:l===1?null:'fan'};
lands=l===0?[rect('start',-50,470,500),rect('goal',840,1330,450)]:l===1?[rect('start',-50,310,500),rect('fixedL',300,470,500,650,'cardPlatform'),rect('fixedR',840,1000,450,600,'cardPlatform'),rect('goal',990,1330,450)]:[rect('start',-50,425,590),rect('goal',790,1330,310)];
coin={x:l===0?720:l===1?740:850,y:l===0?360:l===1?390:235,taken:false,pop:0};rebuild();spawn();$('win').hidden=true;sync();}
function sync(){document.querySelectorAll('[data-level]').forEach(b=>b.classList.toggle('active',+b.dataset.level===level));$('chapter').textContent=`实验 0${level+1} / ${['翻','换','甩'][level]}`;$('name').textContent=titles[level];$('goal').textContent=goals[level];$('modeText').textContent=mode==='edit'?'编辑 · 角色暂停':'角色';$('toggle').textContent=mode==='edit'?'Tab 返回':'Tab 编辑';$('edit').hidden=!(mode==='edit'&&selected);$('foldControls').hidden=level!==0;$('parts').hidden=level!==1;$('slingControls').hidden=level!==2;$('selectedLabel').textContent=level===1?'卡片槽位 / 限定吸附':level===2?'甩动 / 固定铰边':'纸板开合 / 固定铰边';$('editNote').textContent=level===0?'拖动方形端点可连续开合；所有纸层保留同一铰接边。':level===1?'旋转整张卡片，纸层与纸板一起转动。': '也可返回角色模式，在外端按 F；近铰边甩动力小。';$('aperture').value=Math.round(fan.open/PI*180);$('angle').textContent=Math.round(fan.open/PI*180)+'°';$('special').textContent=level===2?'F':'R';$('specialText').textContent=level===2?'甩开 / R 回存档':'回存档';$('counter').textContent=`◇ ${coin.taken?1:0} / 1`;$('legend').hidden=!debug;document.querySelectorAll('[data-part]').forEach(b=>b.classList.toggle('selected',b.dataset.part===fan.part));$('context').textContent=mode==='edit'?'拖动纸板方形端点；圆形铰边始终固定。':level===2?'站在活动纸板外端：距铰点越远，甩动越强。':'F3 结构透视 · 纸层边界同时就是碰撞边界。';}
function openTo(angle,instant=false){if(level!==0||sling)return;angle=clamp(angle,.08,PI);if(instant){let prev=parts.find(x=>x.id==='fan');fan.open=angle;rebuild();carry(prev,parts.find(x=>x.id==='fan'),DT,false)}else motion={from:fan.open,to:angle,fromRot:fan.rot,toRot:fan.rot,t:0,d:.9};sync()}
function install(kind){if(level!==1)return;fan.part=kind;fan.rot=PI/2;motion=null;p.ground=null;rebuild();sync();toast(kind==='fan'?'扇面已吸附。试着把卡片转 90°。':'双球卡片已吸附：宽度不足，可以随时替换。')}
function rotate(){if(level!==1||!fan.part||motion)return;let next=Math.abs(fan.rot)<.01?PI/2:0;motion={from:fan.open,to:fan.open,fromRot:fan.rot,toRot:next,t:0,d:.8};toast('纸板、铰边与纸层作为整体转向。')}
function fire(){if(level!==2||sling)return;if(p.ground!=='fan'||p.x>515||p.x<430){toast('先站上活动纸板左侧外端（虚线标记），再按 F。');return}mode='play';selected=false;sling={t:0,released:false};motion=null;sync()}
function carry(old,g,dt,canRelease){if(!old||!g||p.ground!=='fan')return;let ox=p.x,oy=p.y,dx=p.x-old.x,dy=p.y+H-old.y,r=Math.hypot(dx,dy),a=Math.atan2(dy,dx),start=old.rot-PI;while(a<start-.001)a+=2*PI;while(a>start+2*PI)a-=2*PI;let u=clamp((a-start)/old.open,0,1),angle=g.rot-PI+g.open*u;let nx=g.x+r*Math.cos(angle),ny=g.y+r*Math.sin(angle);p.x=nx;p.y=ny-H;let h=at(g,p.x);if(!h||Math.abs(h.y-ny)>4||(!canRelease&&Math.abs(h.slope)>=1)){p.x=ox;p.y=oy;p.ground=null;return}p.y=h.y-H;
if(canRelease&&fan.open>=.45&&!sling.released){let vx=(p.x-ox)/dt*1.25,vy=(p.y-oy)/dt*1.25;p.vx=vx;p.vy=vy;p.air=true;p.ground=null;sling.released=true;jumpBase=p.y+H;toast('接触点速度 → 抛物线。空中 A / D 可微调。')}}
// Convex separating-axis displacement handles an edited solid meeting a paused body.
// It pushes by the smallest geometric distance; it never moves the child to a destination.
function separation(g){let best=null,amount=Infinity,axes=[{x:1,y:0},{x:0,y:1}];for(let i=0;i<g.poly.length;i++){let a=g.poly[i],b=g.poly[(i+1)%g.poly.length],dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);if(len>.001)axes.push({x:-dy/len,y:dx/len})}for(let n of axes){let lo=Infinity,hi=-Infinity;for(let v of g.poly){let q=v.x*n.x+v.y*n.y;lo=Math.min(lo,q);hi=Math.max(hi,q)}let center=p.x*n.x+(p.y+H/2)*n.y,radius=W/2*Math.abs(n.x)+H/2*Math.abs(n.y),min=center-radius,max=center+radius;if(max<=lo+.001||min>=hi-.001)return null;let pos=hi-min,neg=max-lo,d=pos<neg?pos:-neg;if(Math.abs(d)<amount){amount=Math.abs(d);best={x:n.x*d,y:n.y*d}}}return best}
function resolveDynamic(){for(let pass=0;pass<3;pass++){let touched=false;for(let g of parts){let d=separation(g);if(d){p.x+=d.x;p.y+=d.y;touched=true;if(d.y<0)p.vy=Math.min(p.vy,0)}}if(!touched)break}}
function animate(dt){let changing=!!motion||!!sling,old=parts.find(x=>x.id==='fan');if(motion){motion.t+=dt;let u=clamp(motion.t/motion.d,0,1),s=u*u*(3-2*u);fan.open=lerp(motion.from,motion.to,s);fan.rot=lerp(motion.fromRot,motion.toRot,s);rebuild();if(u===1)motion=null;sync()}
if(sling){sling.t+=dt;if(sling.t<1.5)fan.open=Math.min(PI,fan.open+5.4*dt);else fan.open=Math.max(.08,fan.open-2.8*dt);rebuild();if(sling.t>2.8){sling=null;fan.open=.08;rebuild();sync()}}
carry(old,parts.find(x=>x.id==='fan'),dt,!!sling&&!sling.released);if(changing&&!p.ground)resolveDynamic()}
function physics(dt){animate(dt);if(p.ground){let contact=all().find(g=>g.id===p.ground),h=contact&&at(contact,p.x);if(!h||Math.abs(h.slope)>=1)p.ground=null}let right=keys.has('KeyD')||keys.has('ArrowRight'),left=keys.has('KeyA')||keys.has('ArrowLeft'),move=Number(right)-Number(left);if(move)p.face=move;if(p.air)p.vx=clamp(p.vx+move*110*dt,-650,650);else p.vx=move*V;
if(queued){if(p.ground){p.vy=-JV;p.ground=null;jumpBase=p.y+H;apex=0}queued=false}
let ground=p.ground&&all().find(g=>g.id===p.ground),ox=p.x,foot=p.y+H;p.x=clamp(p.x+p.vx*dt,12,1268);
if(ground){let h=at(ground,p.x);if(h&&Math.abs(h.slope)<1&&Math.abs(h.y-foot)<8){p.y=h.y-H;p.vy=0}else p.ground=null}
for(let g of all()){let h=at(g,p.x);if(h&&p.y+H>h.y+.6&&p.y<h.b-.6){if(!(ground===g&&Math.abs(h.slope)<1&&Math.abs(h.y-foot)<8)){p.x=ox;p.vx=0}}}
let prev=p.y+H,prevTop=p.y,v0=p.vy;p.y+=v0*dt+.5*G*dt*dt;p.vy+=G*dt;p.ground=null;
for(let g of all()){let h=at(g,p.x);if(!h)continue;if(p.vy>=0&&prev<=h.y+1&&p.y+H>=h.y){p.y=h.y-H;p.vy=0;if(Math.abs(h.slope)<1){p.ground=g.id;p.air=false}else{p.x+=Math.sign(h.slope)*125*dt;let slide=at(g,p.x);if(slide)p.y=slide.y-H}}else if(v0<0&&prevTop>=h.b-.5&&p.y<h.b){p.y=h.b;p.vy=0}}
if(jumpBase!==null)apex=Math.max(apex,jumpBase-p.y-H);
if(!coin.taken&&Math.hypot(p.x-coin.x,p.y+H/2-coin.y)<37){coin.taken=true;coin.pop=1;for(let i=0;i<12;i++)fx.push({x:coin.x,y:coin.y,vx:Math.cos(i/12*PI*2)*65,vy:Math.sin(i/12*PI*2)*65,t:1});sync()}
if(p.y>835){spawn();toast('回到存档点。纸板形态和碎片保留。')}
if(p.x>1150&&p.ground==='goal'&&(level!==2||coin.taken)){done=true;keys.clear();$('win').hidden=false;$('winTitle').textContent=['同一叠纸，展开另一条路。','换的是卡片，改变的是通路。','把纸的运动，交给身体。'][level];$('winText').textContent=`${Math.round(time)} 秒 · 碎片 ${coin.taken?1:0}/1 · ${['可尝试不同开合角度，寻找可落脚的纸面。','可重新旋转卡片，观察路径为何断开。','弹射方向来自活动纸板接触点的运动。'][level]}`;$('next').textContent=level===2?'重回实验 01 ↻':'下一实验 →'}
}
function update(dt){toastTime-=dt;if(toastTime<=0)$('toast').classList.remove('show');coin.pop=Math.max(0,coin.pop-2*dt);fx.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt});fx=fx.filter(q=>q.t>0);if(done)return;if(mode==='play'){time+=dt;physics(dt)}else animate(dt)}

function boardRay(f,a,active=false){let ex=f.x+f.r*Math.cos(a),ey=f.y+f.r*Math.sin(a),dx=24,dy=11;c.beginPath();c.moveTo(f.x,f.y);c.lineTo(ex,ey);c.lineTo(ex+dx,ey+dy);c.lineTo(f.x+dx,f.y+dy);c.closePath();c.fillStyle=active?'#aebfa9':'#bbc3b4';c.fill();c.strokeStyle='#65775f';c.lineWidth=1;c.stroke();line(f.x,f.y,ex,ey,active?'#718b7d':'#343e39',4);line(f.x+dx,f.y+dy,ex+dx,ey+dy,active?'#9dae9f':'#85947e',2);if(active){c.fillStyle='#edf3e7';c.strokeStyle='#6c8875';c.lineWidth=2;c.fillRect(ex-6,ey-6,12,12);c.strokeRect(ex-6,ey-6,12,12)}}
function paper(g){let f=g; // Orthographic 2.5D leaves: fixed hinge + radial leaf planes + paper depth.
c.save();c.shadowColor='#273b2915';c.shadowBlur=12;c.shadowOffsetY=8;trace(g);c.fillStyle='#dce1d5';c.fill();c.restore();
const count=34;for(let i=0;i<=count;i++){let a=f.rot-PI+f.open*i/count;let shade=i%2?'#f8faf2':'#c7d0be';c.beginPath();c.moveTo(f.x,f.y);for(let k=0;k<=30;k++){let r=f.r*k/30,z=24+Math.sin(k/30*PI)*30;c.lineTo(f.x+r*Math.cos(a)+z,f.y+r*Math.sin(a)+z*.46)}for(let k=30;k>=0;k--){let r=f.r*k/30,z=24+Math.sin(k/30*PI)*30;c.lineTo(f.x+r*Math.cos(a),f.y+r*Math.sin(a))}c.closePath();c.fillStyle=shade;c.fill();c.strokeStyle='#a3af995c';c.lineWidth=.7;c.stroke();}
// Repeated staggered glued nodes connect neighbouring leaves into a honeycomb.
for(let row=1;row<9;row++){let r=f.r*row/9;for(let i=0;i<count;i++){let a=f.rot-PI+f.open*i/count,b=f.rot-PI+f.open*(i+1)/count;let x0=f.x+r*Math.cos(a),y0=f.y+r*Math.sin(a),x1=f.x+r*Math.cos(b),y1=f.y+r*Math.sin(b);let bend=((i+row)%2?1:-1)*3;c.beginPath();c.moveTo(x0,y0);c.quadraticCurveTo((x0+x1)/2+bend,(y0+y1)/2+2,x1,y1);c.strokeStyle='#a0ad9360';c.lineWidth=.7;c.stroke()}}
// Open cells are a geometric lattice: the same nodes spread angularly as the boards open.

c.save();trace(g);c.clip();for(let row=1;row<9;row++){let r0=f.r*(.08+row*.092),dr=f.r*.092;for(let col=0;col<22;col++){let u=(col+(row%2)*.5)/22,du=1/22;if(u+du>1)continue;let coords=[[u+du*.5,r0],[u+du,r0+dr*.25],[u+du,r0+dr*.75],[u+du*.5,r0+dr],[u,r0+dr*.75],[u,r0+dr*.25]].map(([q,r])=>{let a=f.rot-PI+f.open*q;return{x:f.x+r*Math.cos(a),y:f.y+r*Math.sin(a)}});c.beginPath();coords.forEach((q,j)=>j?c.lineTo(q.x,q.y):c.moveTo(q.x,q.y));c.closePath();c.fillStyle=(row+col)%2?'#ccd5c0b8':'#d7decec9';c.fill();c.strokeStyle='#f9fbf1';c.lineWidth=1.5;c.stroke();c.beginPath();coords.slice(0,4).forEach((q,j)=>j?c.lineTo(q.x+1,q.y+1):c.moveTo(q.x+1,q.y+1));c.strokeStyle='#a3b295a8';c.lineWidth=.8;c.stroke()}}c.restore();
// Reinforced paper edge is exactly the collision contour.
c.beginPath();g.poly.slice(1).forEach((v,i)=>i?c.lineTo(v.x,v.y):c.moveTo(v.x,v.y));c.strokeStyle='#77896f';c.lineWidth=1.5;c.stroke();boardRay(f,f.rot-PI,false);boardRay(f,f.rot-PI+f.open,true);c.fillStyle='#f4f7ec';c.strokeStyle='#3f594b';c.lineWidth=2;c.beginPath();c.arc(f.x,f.y,8,0,2*PI);c.fill();c.stroke();c.beginPath();c.arc(f.x,f.y,2,0,2*PI);c.fillStyle='#3f594b';c.fill();
}
function block(g){trace(g);c.fillStyle=g.kind==='board'?'#d1d9c8':g.kind==='cardPlatform'?'#e0e5d9':'#e4e7de';c.fill();c.strokeStyle='#b9c3b0';c.lineWidth=1;c.stroke();if(g.kind==='board')return;let top=g.poly[0].y;line(g.a[0].x,top,g.a[N].x,top,'#677c60',2);if(g.kind!=='board'){line(g.a[N].x,top,g.a[N].x+13,top+8,'#c6cdbf',1);line(g.a[0].x,top+8,g.a[N].x,top+8,'#ccd3c5',1)}}
function bud(g){trace(g);c.fillStyle='#e1e6d9';c.fill();c.strokeStyle='#b2bfa5';c.stroke();for(let i=-8;i<=8;i++){let rx=g.r*Math.sqrt(1-(i/9)**2)*.18;c.beginPath();c.ellipse(g.cx+i*g.r/10*Math.cos(g.rot||0),g.cy+i*g.r/10*Math.sin(g.rot||0),rx,(g.ry||g.r)*Math.sqrt(1-(i/9)**2),g.rot||0,0,PI*2);c.stroke()}}
function player(t){let walk=p.ground?Math.sin(t*15)*Math.min(1,Math.abs(p.vx)/100):0;c.save();c.translate(p.x,p.y);c.fillStyle='#3b4e43';c.beginPath();c.arc(0,8,8,0,2*PI);c.fill();c.beginPath();c.roundRect(-9,17,18,23,5);c.fill();line(-4,37,-5-walk*4,48,'#3b4e43',4);line(4,37,5+walk*4,48,'#3b4e43',4);line(-9,22,-12,32,'#3b4e43',3);line(9,22,12,32,'#3b4e43',3);line(-7,19,7,19,'#e6e9cf',2);c.fillStyle='#f0f4e5';c.fillRect(p.face*3-1,6,2,2);c.restore()}
function draw(t=0){c.fillStyle='#f3f4ed';c.fillRect(0,0,1280,720);c.lineWidth=1;for(let x=0;x<=1280;x+=40)line(x,0,x,720,'#e8ebe2');for(let y=0;y<=720;y+=40)line(0,y,1280,y,'#e8ebe2');
// A neutral void and contact shadows make depth readable without textures.
c.fillStyle='#e7ece0';c.beginPath();c.ellipse(650,730,340,35,0,0,2*PI);c.fill();lands.forEach(block);
if(level===1){c.save();c.setLineDash([5,5]);c.strokeStyle='#94a88d';c.strokeRect(475,420,355,235);c.restore();if(!fan.part){txt('＋ 预留卡片槽',650,530,16,'#8b9d7f');txt('Tab · 点击槽位换装',650,556,11)}}
parts.filter(g=>g.kind==='board').forEach(block);parts.filter(g=>g.kind!=='board').forEach(g=>g.kind==='fan'?paper(g):g.kind==='bud'?bud(g):block(g));
let gy=level===2?310:450;line(1180,gy,1180,gy-64,'#657e5e',2);c.fillStyle='#91a684';c.beginPath();c.moveTo(1180,gy-64);c.lineTo(1207,gy-55);c.lineTo(1180,gy-46);c.fill();txt('出口',1190,gy-80,10,'#7d9072');txt('存档',125,level===2?622:532,9,'#96a28c');
if(level===0&&mode==='play'){txt('固定铰边',fan.x+52,fan.y+29,10,'#8d9c80');line(fan.x+12,fan.y+4,fan.x+35,fan.y+22,'#afbaa2')}
if(level===2){c.save();c.setLineDash([4,4]);line(435,586,510,586,'#8d9e70',2);c.restore();txt('外端站位 · F 甩开',475,566,10,'#7f926c');txt('远离铰点 → 线速度更大',595,680,10,'#98a48b');}
if(!coin.taken||coin.pop>0){c.save();c.translate(coin.x,coin.y+Math.sin(t*2)*3);c.scale(coin.taken?1+(1-coin.pop)*2:1,coin.taken?1+(1-coin.pop)*2:1);c.globalAlpha=coin.taken?coin.pop:1;c.rotate(.4);c.fillStyle='#d7dfbb';c.strokeStyle='#859566';c.lineWidth=1;c.beginPath();c.moveTo(0,-12);c.quadraticCurveTo(17,0,0,14);c.quadraticCurveTo(-10,0,0,-12);c.fill();c.stroke();line(0,-8,0,9,'#a8b48b');c.restore()}
fx.forEach(q=>{c.globalAlpha=q.t;c.fillStyle='#a2b48b';c.fillRect(q.x,q.y,3,3)});c.globalAlpha=1;
if(mode==='edit'){c.save();c.setLineDash([5,6]);c.strokeStyle='#8b9f7d';c.lineWidth=1;c.strokeRect(level===1?475:fan.x-fan.r-15,level===1?420:fan.y-fan.r-15,level===1?355:fan.r*2+30,level===1?235:fan.r+35);c.restore();if(selected&&level===0){c.save();c.setLineDash([3,7]);c.strokeStyle='#b1bda2';c.beginPath();c.arc(fan.x,fan.y,fan.r,-PI,0);c.stroke();c.restore();txt('活动纸板端点 · 拖动',fan.x-80,fan.y-fan.r-35,10,'#879b77')}}
player(t);
if(debug){c.save();for(let g of all()){trace(g);c.strokeStyle='#d47b7e';c.lineWidth=1.3;c.stroke()}c.strokeStyle='#508ca2';c.strokeRect(p.x-W/2,p.y,W,H);c.fillStyle='#f9fbf1ee';c.strokeStyle='#d1d9c5';c.fillRect(27,128,315,137);c.strokeRect(27,128,315,137);txt(`FPS ${fps.toFixed(0)} · 120 Hz 物理 · H=50 / D=200`,40,151,11,'#6e8062','left');txt(`v (${p.vx.toFixed(1)}, ${p.vy.toFixed(1)}) · 接地 ${p.ground||'否'}`,40,175,11,'#6e8062','left');txt(`开合 ${(fan.open/PI*180).toFixed(1)}° · 卡片 ${(fan.rot/PI*180).toFixed(0)}°`,40,199,11,'#6e8062','left');txt(`普通跳高 ${apex.toFixed(3)} / 100 · 坡度 <45°`,40,223,11,'#6e8062','left');txt('铰点固定 · 纸层角度变化 · 径向长度保持',40,247,10,'#899b7c','left');if(sling&&p.air){line(p.x,p.y+25,p.x+p.vx*.15,p.y+25+p.vy*.15,'#698f8b',2)}c.restore()}}
function toggle(){if(done)return;mode=mode==='edit'?'play':'edit';selected=mode==='edit';keys.clear();queued=false;sync()}
function point(e){let r=cv.getBoundingClientRect();let scale=Math.min(r.width/1280,r.height/720),ox=(r.width-1280*scale)/2,oy=(r.height-720*scale)/2;return{x:(e.clientX-r.left-ox)/scale,y:(e.clientY-r.top-oy)/scale}}
function endPoint(){let a=fan.rot-PI+fan.open;return{x:fan.x+fan.r*Math.cos(a),y:fan.y+fan.r*Math.sin(a)}}
cv.addEventListener('pointerdown',e=>{if(done)return;let q=point(e);if(mode!=='edit')return;let end=endPoint();if(level===0&&Math.hypot(q.x-end.x,q.y-end.y)<30){drag=true;motion=null;cv.setPointerCapture(e.pointerId)}selected=q.x>fan.x-fan.r-20&&q.x<fan.x+fan.r+20&&q.y>fan.y-fan.r-30&&q.y<fan.y+100;if(level===1)selected=q.x>475&&q.x<830&&q.y>420&&q.y<660;sync()});
cv.addEventListener('pointermove',e=>{if(!drag)return;let q=point(e),a=Math.atan2(q.y-fan.y,q.x-fan.x);if(a>0)a=q.x<fan.x?-PI:0;openTo(a+PI,true)});cv.addEventListener('pointerup',()=>drag=false);cv.addEventListener('pointercancel',()=>drag=false);
document.addEventListener('keydown',e=>{if(['Tab','Space','ArrowLeft','ArrowRight','F3'].includes(e.code))e.preventDefault();if(e.repeat&&['Tab','Space','KeyF','KeyR','F3'].includes(e.code))return;keys.add(e.code);if(e.code==='Tab')toggle();if(e.code==='Space'&&mode==='play')queued=true;if(e.code==='KeyR'){spawn();toast('已回到存档，保留当前形态。')}if(e.code==='KeyF'&&mode==='play')fire();if(e.code==='F3'){debug=!debug;sync()}if(e.code==='Escape'){selected=false;sync()}});document.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>{keys.clear();queued=false});
$('toggle').onclick=toggle;$('fold').onclick=()=>openTo(.08);$('unfold').onclick=()=>openTo(PI);$('aperture').oninput=e=>openTo(+e.target.value/180*PI,true);$('rotate').onclick=rotate;$('sling').onclick=fire;$('reset').onclick=()=>load(level);$('inspect').onclick=()=>{debug=!debug;sync()};$('fullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.querySelector('main').requestFullscreen?.()};document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>load(+b.dataset.level));document.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>install(b.dataset.part));$('next').onclick=()=>load((level+1)%3);$('again').onclick=()=>load(level);
let last=0,acc=0;function frame(t){let d=last?Math.min((t-last)/1000,.1):0;last=t;if(d)fps=lerp(fps,1/d,.05);acc+=d;while(acc>=DT){update(DT);acc-=DT}draw(t/1000);requestAnimationFrame(frame)}load(0);requestAnimationFrame(frame);
window.PaperDream={load,step(n=1){for(let i=0;i<n;i++)update(DT)},get state(){return{level,p,fan,parts,lands,coin,done,mode,apex,sling,motion}},open:openTo,install,rotate,fire,press(k){keys.add(k)},release(k){keys.delete(k)},jump(){queued=true},setMode(m){mode=m;selected=m==='edit';sync()},place(x,y){Object.assign(p,{x,y,vx:0,vy:0,ground:null,air:false})},spawn,draw,at,constants:{H,W,G,V,JV,DT}};
