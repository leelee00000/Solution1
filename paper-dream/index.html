let run=null;const app=document.getElementById('app'),$=id=>document.getElementById(id);
function save(){try{localStorage.setItem('food-game-mission-v1',JSON.stringify(meta))}catch(e){}$('xp').textContent='✦ '+meta.xp}
function home(){run=null;save();app.innerHTML='<div class="hero"><small>家庭饮食助手 · 生活日历</small><h1>今天也要好好吃饭。</h1><p>帮一家三口建立自己的饮食判断。每周完成委托，周末离线验收。</p></div><div class="grid">'+weeks.map((w,i)=>'<button class="tile" '+(i>meta.unlock?'disabled':'onclick="start('+i+')"')+'><small>WEEK 0'+(i+1)+' · '+(i>meta.unlock?'待解锁':'最佳 '+meta.best[i]+'/3')+'</small><div><h2>'+w.name+'</h2>'+w.hook+'</div><small>'+w.mission+' '+(i>meta.unlock?'🔒':'→')+'</small></button>').join('')+'</div><div class="actions"><button onclick="shop()">助手升级</button><button onclick="album()">观察图鉴 · '+meta.found.length+'</button></div>'}
function start(i){if(i>meta.unlock)return;run={w:i,i:0,left:4+(meta.up.includes('speech')?2:0),phase:0,done:[],log:[],branch:0};app.innerHTML='<div class="end"><small>'+weeks[i].name+' · 本周委托</small><h1>'+weeks[i].mission+'</h1><p>'+weeks[i].desc+'</p>'+cases[i].map((c,j)=>'<div class="check"><span class="mark">0'+(j+1)+'</span>'+c.goal+'</div>').join('')+'<div class="receipt">全周发言：'+run.left+' 次　｜　达成 2/3 项开启新主题</div><div class="actions"><button onclick="home()">返回日历</button><button class="primary" onclick="begin()">接受委托</button></div></div>'}
function begin(){const c=cases[run.w][run.i];run.phase=0;run.log=[];if(run.i){let prev=run.done[run.i-1],pc=cases[run.w][run.i-1],line=pc.carry[prev.ok?0:1].split('：');run.log.push([line[0].replace('老',''),line.slice(1).join('：')])}run.log.push(...c.opening);play()}
function msg(m){return '<div class="msg '+(m[0]==='助手'?'me':'')+'"><div class="avatar">'+({妈:'妈',爸:'爸',女:'女',女儿:'女',助手:'助'}[m[0]]||m[0].slice(-1))+'</div><div><div class="name">'+({妈:'老妈',爸:'老爸',女:'女儿'}[m[0]]||m[0])+'</div><div class="bubble">'+m[1]+'</div></div></div>'}
function play(){let c=cases[run.w][run.i],b=c.branches[run.branch],limit=4+(meta.up.includes('speech')?2:0);let buttons='';if(run.phase===0){buttons=c.branches.map((v,j)=>'<button '+(v.say&&run.left===0?'disabled':'')+' onclick="first('+j+')">'+(v.say||'继续看他们聊')+'</button>').join('')}else if(run.phase===1||run.phase===3){let say=b.fix;buttons='<button '+(!run.left?'disabled':'')+' onclick="second(1)">'+say+'</button>';if(meta.up.includes('style')&&run.left)buttons+='<button onclick="second(1,true)">举个例子：如果换一种情境，我们也这样判断吗？</button>';buttons+='<button onclick="second(0)">先观察，留一次发言</button>'}else buttons='<button class="primary" onclick="advance()"> '+(run.i===2?'进入周末离线日':'查看这次的后续变化')+' →</button>';
app.innerHTML='<div class="layout"><aside class="side"><small>'+weeks[run.w].name+' · '+(run.i+1)+'/3</small><h2>'+weeks[run.w].mission+'</h2><p class="muted">周末验收 · 目标 2/3</p>'+cases[run.w].map((x,i)=>'<div class="check"><span class="mark">'+(i<run.i?'◉':i===run.i?'●':'○')+'</span>'+x.goal+'</div>').join('')+'<p>本周剩余发言　<b>'+run.left+'</b></p><div class="bar">'+Array.from({length:limit},(_,i)=>'<i class="'+(i<run.left?'on':'')+'"></i>').join('')+'</div><p class="muted">已观察 '+run.done.length+' / 3</p></aside><section><div class="row"><div><small>'+c.when+'</small><h2 style="margin:6px 0">相亲相爱一家人（4）</h2></div><span class="badge">'+c.food+'</span></div><div class="chat" id="chat">'+run.log.map(msg).join('')+'</div><div class="options"><small>'+(run.phase===2?'闲聊结束':'剩余 '+run.left+' 次 · 要不要插话？')+'</small>'+buttons+'</div></section></div>';let el=$('chat');el.scrollTop=el.scrollHeight}
function first(j){if(run.phase!==0)return;let c=cases[run.w][run.i],b=c.branches[j];if(b.say&&!run.left)return;run.branch=j;if(b.say){run.left--;run.log.push(['助手',b.say])}run.log.push(...b.reply);run.phase=1;play()}
function second(yes,style){if(run.phase!==1&&run.phase!==3)return;let c=cases[run.w][run.i],b=c.branches[run.branch];if(yes&&!run.left)return;if(!yes&&run.phase===1&&meta.up.includes('patience')&&run.left&&!b.pass){run.log.push(['爸','等一下，刚才这事我还想了一下。'],['女','爸今天居然主动续费聊天时间。']);run.phase=3;play();return}if(yes){run.left--;run.log.push(['助手',style?'换个情境想一想。'+b.fix:b.fix]);run.log.push(...b.good)}else run.log.push(...b.bad);run.done.push({ok:outcome(c,b,yes),branch:run.branch,yes:!!yes});run.phase=2;play()}
function advance(){if(run.phase!==2)return;let c=cases[run.w][run.i],d=run.done[run.i],o=d.ok?c.win:c.lose;app.innerHTML='<div class="end"><small>'+c.when+' · 后续观察</small><h1>'+o[0]+'</h1><div class="receipt"><small>'+c.person+' · 分享了新餐食</small><div class="food">'+o[0]+'</div><p>“'+o[1]+'”</p></div><div class="check"><span class="mark">'+(d.ok?'✓':'○')+'</span>'+c.goal+'<span class="muted">'+(d.ok?'出现积极迹象':'仍有待观察')+'</span></div><p class="muted">周末确认他们能否独立应用这一判断。</p><div class="actions"><button class="primary" onclick="nextScene()">'+(run.i===2?'周末离线验收':'下一段生活')+' →</button></div></div>'}
function nextScene(){if(run.i<2){run.i++;begin()}else offline()}
function offline(){let w=run.w;app.innerHTML='<div class="end"><small>周末 · 助手离线</small><h1>今天，由他们自己决定。</h1>'+cases[w].map((c,i)=>{let d=run.done[i],o=d.ok?c.win:c.lose;return '<div class="receipt"><div class="row"><small>'+c.person+' · 独立选择</small><span class="badge">'+(d.ok?'达成':'待改善')+'</span></div><div class="food">'+o[0]+'</div><p>“'+o[1]+'”</p><small>'+c.goal+'</small></div>'}).join('')+'<div class="actions"><button class="primary" onclick="settle()">查看委托结果</button></div></div>'}
function settle(){if(!run||run.settled)return;run.settled=true;let w=run.w,score=run.done.filter(d=>d.ok).length,newFound=[];run.done.forEach((d,i)=>{let t=cases[w][i].discover;if(!d.ok&&!meta.found.includes(t)){meta.found.push(t);newFound.push(t)}});let old=meta.best[w],reward=Math.max(0,score-old)*2+newFound.length;if(score>=2&&old<2)reward+=2;meta.best[w]=Math.max(old,score);let unlocked=score>=2&&w===meta.unlock&&w<2;if(unlocked)meta.unlock++;meta.xp+=reward;save();app.innerHTML='<div class="end"><small>'+weeks[w].name+' · 委托验收</small><h1>'+ (score===3?'圆满完成':score>=2?'委托完成':'还有些话没说清')+'　'+score+'/3</h1><div class="row"><b>✦ +'+reward+' 经验</b><span class="badge">历史最佳 '+meta.best[w]+'/3</span></div>'+cases[w].map((c,i)=>'<div class="check"><span class="mark">'+(run.done[i].ok?'✓':'○')+'</span>'+c.goal+'</div>').join('')+(newFound.length?'<div class="receipt">新发现 · '+newFound.join(' / ')+'</div>':'')+(unlocked?'<div class="receipt"><b>新主题已解锁：'+weeks[w+1].name+'</b><p>在生活日历选择开启。</p></div>':'')+(score<2?'<p>再尝试一周，完成至少两项委托。</p>':'')+'<div class="actions"><button onclick="start('+w+')">重玩本周</button><button onclick="shop()">升级助手</button><button class="primary" onclick="home()">返回日历</button></div></div>'}
const upgrades=[['speech','发言扩容','每周额外获得 2 次发言',3],['style','表达优化','追加对比例子话术',3],['patience','家庭默契','部分闲聊多一次介入机会',3]];
function shop(){app.innerHTML='<div class="end"><small>局外成长</small><h1>助手升级</h1><div class="shop">'+upgrades.map((u,i)=>'<div class="receipt row"><div><b>'+u[1]+'</b><p>'+u[2]+'</p></div><button '+(meta.up.includes(u[0])||meta.xp<u[3]?'disabled':'onclick="buy('+i+')"')+'>'+(meta.up.includes(u[0])?'已拥有':'✦ '+u[3])+'</button></div>').join('')+'</div><div class="actions"><button class="primary" onclick="home()">返回生活日历</button></div></div>'}
function buy(i){let u=upgrades[i];if(meta.up.includes(u[0])||meta.xp<u[3])return;meta.xp-=u[3];meta.up.push(u[0]);save();shop()}
function album(){app.innerHTML='<div class="end"><small>认知图鉴 · '+meta.found.length+'/9</small><h1>人类饮食观察</h1><div class="grid">'+cases.flat().map(c=>'<div class="receipt">'+(meta.found.includes(c.discover)?'<b>'+c.discover+'</b><p>“'+c.lose[1]+'”</p>':'<b>？</b><p>尚未发现</p>')+'</div>').join('')+'</div><div class="actions"><button class="primary" onclick="home()">返回日历</button></div></div>'}
home();
</script></body></html>
