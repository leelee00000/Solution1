const point=(x,y,o)=>({x:o.x+o.s*(x*Math.cos(o.a)-y*Math.sin(o.a)),y:o.y+o.s*(x*Math.sin(o.a)+y*Math.cos(o.a))});function say(s){message=s;messageTime=6}function rect(id,x,y,w,h=30){return{id,pts:[{x,y},{x:x+w,y},{x:x+w,y:y+h},{x,y:y+h}],kind:'land'}}function card(id,x,y,s=1,opened=false){return{id,x,y,s,a:0,target:0,opened,progress:opened?1:0,flowers:[0,1,2].map(()=>({form:'ball',from:'ball',t:1,dir:'up',gone:false}))}}const anchors=[{x:0,y:-60},{x:-100,y:60},{x:100,y:60}];

function opening(dir){const o=cards[selected];if(!o||o.id==='final')return;o.opened=true;o.progress=.02;for(let i=0;i<3;i++){const f=o.flowers[i];f.dir=dir;f.from=f.form;f.form=dir==='up'&&i>0?'spike':'ball';f.t=0}updateTilt(o);sync()}

function setForm(form,dir='up'){const o=cards[selected];if(!o||!o.opened||o.flowers[flower].gone)return;const f=o.flowers[flower];f.from=f.form;f.form=form;f.t=0;f.dir=dir;updateTilt(o);sync()}
function sync(){ $('title').textContent=names[level];$('objective').textContent=goals[level];$('panel').hidden=!edit;$('mode').textContent=edit?'Tab 试玩':'Tab 编辑';document.querySelectorAll('[data-level]').forEach(b=>b.classList.toggle('active',+b.dataset.level===level));const o=cards[selected];$('selection').textContent=o?'三球卡 · '+(selected+1)+' / 月牙 '+(flower+1):'选择纸板';$('tools').replaceChildren();if(!o)return;const button=(text,fn)=>{let b=document.createElement('button');b.textContent=text;b.onclick=fn;$('tools').append(b)};if(!o.opened){for(const [d,n]of [['up','向上打开'],['left','向左打开 · 倾斜30°'],['right','向右打开 · 倾斜30°']])button(n,()=>opening(d))}else if(level===0){for(const [d,n]of [['up','重新向上打开'],['left','重新向左打开'],['right','重新向右打开']])button(n,()=>opening(d))}else{let sel=document.createElement('select');['上方月牙','左侧月牙','右侧月牙'].forEach((n,i)=>sel.add(new Option(n+(o.flowers[i].gone?'（已脱落）':''),i)));sel.value=flower;sel.onchange=()=>{flower=+sel.value;sync()};$('tools').append(sel);for(const [f,n]of [['ball','凹侧翻 → 球'],['dish','尖端翻 → 盘'],['spike','凸侧翻 → 刺 · 可攀爬']])button(n,()=>setForm(f));button('三朵一起向左翻',()=>{o.flowers.forEach(f=>f.dir='left');updateTilt(o)});button('三朵一起向右翻',()=>{o.flowers.forEach(f=>f.dir='right');updateTilt(o)})}}

function circlePhysics(dt){if(!ball)return;const b=ball;b.age+=dt;b.vy+=G*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.angle+=b.vx/b.r*dt;for(let pass=0;pass<4;pass++)for(const q of polys){if(q.dynamic)continue;let nearest=null,dist=Infinity;for(let i=0;i<q.pts.length;i++){const a=q.pts[i],z=q.pts[(i+1)%q.pts.length],dx=z.x-a.x,dy=z.y-a.y,t=clamp(((b.x-a.x)*dx+(b.y-a.y)*dy)/(dx*dx+dy*dy||1),0,1),x=a.x+dx*t,y=a.y+dy*t,d=Math.hypot(b.x-x,b.y-y);if(d<dist){dist=d;nearest={x,y}}}if(dist<b.r&&dist>.0001){let nx=(b.x-nearest.x)/dist,ny=(b.y-nearest.y)/dist;if(inside(b,q.pts)){nx=-nx;ny=-ny}const pen=b.r-dist;b.x+=nx*pen;b.y+=ny*pen;const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=1.02*vn*nx;b.vy-=1.02*vn*ny;const tangent=b.vx*(-ny)+b.vy*nx;b.vx-=(-ny)*tangent*.025;b.vy-=nx*tangent*.025}}}b.vx=toward(b.vx,0,5*dt);if(b.y>1600){say('纸球掉出场景，重置关卡可以重新尝试。');}}

function physics(dt){animate(dt);if(edit||done)return;let mx=Number(keys.has('KeyD')||keys.has('ArrowRight'))-Number(keys.has('KeyA')||keys.has('ArrowLeft')),my=Number(keys.has('KeyS')||keys.has('ArrowDown'))-Number(keys.has('KeyW')||keys.has('ArrowUp'));if(my){const r=rails.find(r=>Math.abs(p.x-r.top.x)<W/2+14&&p.y+H>r.top.y-5&&p.y<r.bottom.y);if(r)p.climb=r}if(p.climb){const r=rails.find(r=>r.card===p.climb.card&&r.i===p.climb.i);if(!r){p.climb=null}else{p.x=r.top.x+(r.i===2?18:-18);p.y=clamp(p.y+my*145*dt,r.top.y-H,r.bottom.y-1);p.vy=0;p.vx=0;p.spent=false;p.ground=null;if(mx){p.x+=mx*4;p.climb=null}if(keys.has('Space')){keys.delete('Space');p.climb=null;p.vy=-J;p.vx=mx*180;p.spent=true;base=p.y+H}if(p.climb)return}}

function draw(){g.clearRect(0,0,1280,720);g.fillStyle='#f5f5ef';g.fillRect(0,0,1280,720);let zoom=level===2&&edit?.49:1;if(level===2){let tx=edit?-520:clamp(p.x-640,0,170),ty=edit?-35:clamp(p.y-360,0,730);camera.x=lerp(camera.x,tx,.12);camera.y=lerp(camera.y,ty,.12)}else{camera.x=0;camera.y=0}g.save();g.scale(zoom,zoom);g.translate(-camera.x,-camera.y);g.strokeStyle='#e7e8df';g.lineWidth=1;for(let x=0;x<1500;x+=100){g.beginPath();g.moveTo(x,0);g.lineTo(x,1450);g.stroke()}for(const q of land)drawPoly(q,q.id==='checkpoint'&&checkpoint?'#cad6be':'#dedfd5');for(const o of cards){const outline=[point(-180,-175,o),point(180,-175,o),point(180,215,o),point(-180,215,o)];drawPoly({pts:outline},'#e4e2d640','#b7b7ad');if(!o.opened){drawPoly({pts:[point(-32,-150,o),point(32,-150,o),point(32,160,o),point(-32,160,o)]},'#d4d2c6');g.fillStyle='#777';g.font='18px system-ui';g.fillText('点击开卡',o.x-40,o.y-180*o.s)}for(let i=0;i<3;i++){const f=o.flowers[i];if(!f.gone&&o.progress>.01){const q=polys.find(q=>q.id===o.id+':'+i);if(q){drawPoly(q,f.form==='spike'?'#d3d3c6':f.form==='dish'?'#eee5cb':'#e4ded0');g.save();g.beginPath();q.pts.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.closePath();g.clip();const root=point(anchor(o,i).x,anchor(o,i).y,o);for(let k=0;k<38;k++){g.beginPath();g.strokeStyle=k%2?'#a6a294':'#c5bda9';g.lineWidth=.8;const t=k/37;for(let j=0;j<q.pts.length;j++){let p1=q.pts[j];const x=lerp(root.x,p1.x,t),y=lerp(root.y,p1.y,t);j?g.lineTo(x,y):g.moveTo(x,y)}g.closePath();g.stroke()}g.restore()}}const a=anchor(o,i);g.beginPath();for(let j=0;j<=24;j++){let t=j/24,pt=point(a.x-50*Math.cos(t*PI),a.y+15*Math.sin(t*PI),o);j?g.lineTo(pt.x,pt.y):g.moveTo(pt.x,pt.y)}for(let j=24;j>=0;j--){let t=j/24,pt=point(a.x-50*Math.cos(t*PI),a.y+32*Math.sin(t*PI),o);g.lineTo(pt.x,pt.y)}g.closePath();g.strokeStyle=edit&&selected===cards.indexOf(o)&&flower===i?'#bd7b39':'#88877a';g.lineWidth=edit?3:1.3;g.stroke()}}

 if(level===2&&!collected){g.fillStyle='#b6a06c';g.beginPath();g.ellipse(180,1030+Math.sin(time*3)*5,10,18,.5,0,2*PI);g.fill()}if(level<2){g.fillStyle='#999b88';g.font='22px system-ui';g.fillText(level===1?'三球卡 →':'出口 →',1000,465)}g.fillStyle='#41463e';g.beginPath();g.arc(p.x,p.y+9,9,0,2*PI);g.fill();g.fillRect(p.x-8,p.y+20,16,22);g.lineWidth=4;g.strokeStyle='#41463e';g.beginPath();g.moveTo(p.x-4,p.y+40);g.lineTo(p.x-6,p.y+50);g.moveTo(p.x+4,p.y+40);g.lineTo(p.x+6,p.y+50);g.stroke();if(debug){for(const q of polys){g.strokeStyle='#cc5c56';g.lineWidth=1;g.beginPath();q.pts.forEach((a,i)=>i?g.lineTo(a.x,a.y):g.moveTo(a.x,a.y));g.closePath();g.stroke()}g.strokeStyle='#31a79b';g.strokeRect(p.x-W/2,p.y,W,H);for(const r of rails){g.beginPath();g.moveTo(r.top.x,r.top.y);g.lineTo(r.bottom.x,r.bottom.y);g.stroke()}}g.restore();if(debug){g.fillStyle='#fffef0ed';g.fillRect(18,575,580,125);g.fillStyle='#444';g.font='14px monospace';[`D=200 H=50 W=24 | g=1600 | jump=${J.toFixed(3)}`,`v=(${p.vx.toFixed(1)},${p.vy.toFixed(1)}) ground=${p.ground} climb=${!!p.climb}`,`jump apex=${apex.toFixed(3)} / 100 | FPS=${fps.toFixed(0)}`,cards.map(o=>`${o.id}:${(o.a*180/PI).toFixed(1)}° ${o.flowers.map(f=>f.gone?'脱落':f.form).join('/')}`).join('  ')].forEach((s,i)=>g.fillText(s,28,598+23*i))}$('status').textContent=`${edit?'编辑模式 · 人物暂停':'角色模式'}　${collected?'◇ 1':'◇ 0'}　${checkpoint?'● 已存档':''}`;$('message').textContent=messageTime>0?message:'';$('message').style.opacity=messageTime>0?1:0}
function step(dt=DT){time+=dt;messageTime=Math.max(0,messageTime-dt);physics(dt)}let previous=0,acc=0;function loop(now){let d=Math.min(.05,(now-previous)/1000||DT);previous=now;fps=lerp(fps,1/d,.05);acc+=d;while(acc>=DT){step();acc-=DT}draw();requestAnimationFrame(loop)}
$('mode').onclick=()=>{edit=!edit;keys.clear();sync()};$('reset').onclick=()=>load(level);$('debug').onclick=()=>debug=!debug;$('next').onclick=()=>load((level+1)%3);document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>load(+b.dataset.level));window.addEventListener('keydown',e=>{if(['Tab','Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','F3'].includes(e.code))e.preventDefault();if(e.repeat)return;if(e.code==='Tab')$('mode').click();else if(e.code==='F3')debug=!debug;else if(e.code==='KeyR'){deaths++;spawn()}else if(e.code==='Escape'){edit=false;sync()}else keys.add(e.code)});window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>keys.clear());let down=null;c.onpointerdown=e=>{if(!edit)return;const r=c.getBoundingClientRect(),z=level===2?.49:1,x=(e.clientX-r.left)*1280/r.width/z+camera.x,y=(e.clientY-r.top)*720/r.height/z+camera.y;let best=Infinity;cards.forEach((o,k)=>{for(let i=0;i<3;i++){const a=point(anchor(o,i).x,anchor(o,i).y,o),d=Math.hypot(x-a.x,y-a.y);if(d<best){best=d;selected=k;flower=i}}});down={x:e.clientX,y:e.clientY};sync()};c.onpointerup=e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.hypot(dx,dy)>25){const o=cards[selected];if(!o.opened)opening(Math.abs(dy)>Math.abs(dx)?'up':dx<0?'left':'right');else setForm(Math.abs(dx)>Math.abs(dy)?'dish':dy<0?'ball':'spike')}down=null};
window.PaperDream={load,step:(n=1)=>{for(let i=0;i<n;i++)step()},state:()=>({level,p,cards,ball,polys,rails,apex,checkpoint,collected,done,cp}),keys,opening,setForm,select:(a,b=0)=>{selected=a;flower=b},mode:x=>edit=x,draw};load(0);requestAnimationFrame(loop)})();
